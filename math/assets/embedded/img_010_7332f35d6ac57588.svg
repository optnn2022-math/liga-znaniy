<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="rayTitle rayDesc"><title id="rayTitle">Натуральные числа на числовом луче</title><desc id="rayDesc">Начало отсчёта 0, равные единичные отрезки, точки A с координатой 3 и B с координатой 7. Направление отсчёта вправо.</desc><rect width="1200" height="350" rx="26" fill="#f0f8ff"/><rect x="15" y="15" width="1170" height="320" rx="20" fill="#ffffff" stroke="#bad9ef" stroke-width="3"/><text x="600" y="65" text-anchor="middle" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" fill="#173e66" font-weight="700">ЧИСЛОВОЙ ЛУЧ · СЧИТАЕМ ВПРАВО</text><path d="M 105 195 H 1070" fill="none" stroke="#295d83" stroke-width="5" stroke-linecap="round"/><text x="1081" y="205" font-size="33" font-family="DejaVu Sans,Arial,sans-serif" fill="#295d83">…</text><line x1="125" y1="176" x2="125" y2="215" stroke="#295d83" stroke-width="4"/><text x="125" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">0</text><line x1="225" y1="176" x2="225" y2="215" stroke="#295d83" stroke-width="4"/><text x="225" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">1</text><line x1="325" y1="176" x2="325" y2="215" stroke="#295d83" stroke-width="4"/><text x="325" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">2</text><line x1="425" y1="176" x2="425" y2="215" stroke="#295d83" stroke-width="4"/><text x="425" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">3</text><line x1="525" y1="176" x2="525" y2="215" stroke="#295d83" stroke-width="4"/><text x="525" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">4</text><line x1="625" y1="176" x2="625" y2="215" stroke="#295d83" stroke-width="4"/><text x="625" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">5</text><line x1="725" y1="176" x2="725" y2="215" stroke="#295d83" stroke-width="4"/><text x="725" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">6</text><line x1="825" y1="176" x2="825" y2="215" stroke="#295d83" stroke-width="4"/><text x="825" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">7</text><line x1="925" y1="176" x2="925" y2="215" stroke="#295d83" stroke-width="4"/><text x="925" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">8</text><line x1="1025" y1="176" x2="1025" y2="215" stroke="#295d83" stroke-width="4"/><text x="1025" y="257" text-anchor="middle" font-size="27" font-family="DejaVu Sans,Arial,sans-serif" fill="#1f476b" font-weight="700">9</text><circle cx="425" cy="195" r="12" fill="#e36838" stroke="white" stroke-width="4"/><text x="425" y="152" text-anchor="middle" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" fill="#e36838" font-weight="700">A(3)</text><circle cx="825" cy="195" r="12" fill="#3e75d6" stroke="white" stroke-width="4"/><text x="825" y="152" text-anchor="middle" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" fill="#3e75d6" font-weight="700">B(7)</text><path d="M225 278 V295 H325 V278" fill="none" stroke="#d69a31" stroke-width="4"/><text x="275" y="322" text-anchor="middle" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" fill="#936021">единичный отрезок</text></svg>