function notify(s){toast.textContent=s;toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2900)}
function score(){if(state.game==='quiz')return state.quizScore;if(state.game==='domino')return state.dominoPlaced.length*100;if(state.game==='climb')return state.climbScore;return 0}
function progress(){if(state.win)return state.win.total;if(state.game==='quiz')return state.quizIndex;if(state.game==='domino')return state.dominoPlaced.length;if(state.game==='climb')return state.climbStep;return 0}
function total(){if(state.game==='quiz')return state.custom?1:bank.length;if(state.game==='domino')return domino.length;if(state.game==='climb')return climb.length;return 0}
function question(){return state.custom?{...state.custom,options:state.custom.o,answer:state.custom.a,why:'Это задание создано учеником. Проверь обоснование ответа вместе с преподавателем.',topic:'Собственная игра'}:bank[state.quizIndex]}
function render(){document.body.dataset.theme=state.theme;document.body.dataset.age=state.age;
 const labels={quiz:'Quiz Pulse',domino:'Domino Chain',climb:'Summit Climb',author:'Студия автора'};
 app.innerHTML=`<div class="app"><aside class="side"><a class="logo" href="#home" aria-label="Neo Arcade Math — на главную"><span class="logo-mark">∑</span><span class="logo-text">NEO ARCADE<small>math lab / beta</small></span></a><div><p class="nav-label">ИГРОВАЯ ЗОНА</p><nav class="nav" aria-label="Выбор раздела">${[['quiz','◈','Викторина'],['domino','▦','Домино'],['climb','⛰','Восхождение'],['author','✦','Создать игру']].map(([k,s,l])=>`<button type="button" data-go="${k}" class="${state.game===k?'active':''}" ${state.game===k?'aria-current="page"':''}><span class="symbol">${s}</span>${l}</button>`).join('')}</nav></div><div class="side-bottom"><strong>✦ СОЗДАВАЙ СВОЁ</strong><p>Придумай математическую задачу, собери варианты и запусти собственную викторину.</p></div></aside><main class="main"><header class="topbar"><div class="eyebrow"><i></i> ИНТЕРАКТИВНАЯ МАСТЕРСКАЯ · ДИЗАЙН-ПРОТОТИП</div><div class="controls"><label class="sr-only" for="theme">Тема оформления</label><select class="dropdown" id="theme"><option value="neo" ${state.theme==='neo'?'selected':''}>✦ Neo Arcade</option><option value="space" ${state.theme==='space'?'selected':''}>✧ Space Quest</option><option value="arena" ${state.theme==='arena'?'selected':''}>⚡ Math Arena</option></select><label class="sr-only" for="age">Размер интерфейса</label><select class="dropdown" id="age"><option value="teen" ${state.age==='teen'?'selected':''}>Teen / Pro</option><option value="junior" ${state.age==='junior'?'selected':''}>Junior</option></select></div></header><section class="hero"><div class="eyebrow"><i></i> НЕ ПРОСТО РЕШАЙ — ИГРАЙ</div><h1>Математика, в которую <span>хочется играть.</span></h1><p>Проверь себя в аркадах или создай собственную математическую игру. Один стиль — десятки приключений.</p><div class="hero-badges"><span>● Математика 1–11</span><span>✦ 3 игровых режима</span><span>◈ Ученик — автор</span></div><div class="hero-glyph" aria-hidden="true">x²</div></section><div class="section-head"><h2>Выбери игру</h2><small>Демонстрационные задания · без входа</small></div><div class="game-tabs">${[['quiz','◇','Quiz Pulse','Викторина'],['domino','▦','Domino Chain','Собери цепочку'],['climb','△','Summit Climb','Путь к вершине']].map(([k,s,l,d])=>`<button type="button" class="game-tab ${state.game===k?'active':''}" data-go="${k}" aria-pressed="${state.game===k}"><span class="ico">${s}</span><span><strong>${l}</strong><small>${d}</small></span></button>`).join('')}</div><section class="game-board" aria-label="${labels[state.game]}">${state.win?viewWin():state.game==='quiz'?viewQuiz():state.game==='domino'?viewDomino():state.game==='climb'?viewClimb():viewAuthor()}</section><p class="footer-note"><span class="live"></span>Визуальный и функциональный прототип · не заменяет рабочую мастерскую 0.2.1 · никаких изменений в основном сайте</p></main></div>`;
}
function hud(title,topic){return `<div class="hud"><div class="hud-name"><div><div class="hud-label"><span class="light"></span>${title}</div><div class="hud-sub">${esc(topic)}</div></div></div><div class="hud-stats"><div class="stat"><strong>${score()}</strong><span>очки</span></div><div class="stat"><strong>${progress()}/${total()}</strong><span>этапы</span></div></div></div><div class="track" aria-label="Прогресс игры"><div style="width:${Math.round(progress()/Math.max(1,total())*100)}%"></div></div>`}
function viewQuiz(){const q=question();if(!q)return '';return `<div class="panel">${hud('◈ ВИКТОРИНА · QUIZ PULSE',q.topic)}<div class="question-card"><span class="mini">ВОПРОС ${state.quizIndex+1} / ${total()}</span><div class="math">${q.display||esc(q.q)}</div><span class="hint">Выбери один правильный ответ</span></div><div class="answers">${q.options.map((o,i)=>`<button type="button" class="answer ${state.quizAnswered?(i===q.answer?'correct':state.quizSelected===i?'wrong':''):''}" data-answer="${i}" ${state.quizAnswered?'disabled':''}><span>${esc(o)}</span><span class="index">${String.fromCharCode(65+i)}</span></button>`).join('')}</div>${state.quizAnswered?`<div class="feedback ${state.quizSelected===q.answer?'good':'bad'}" role="status">${state.quizSelected===q.answer?'✓ Верно!':'↻ Неверный ответ.'} ${esc(q.why)}</div>`:`<div class="feedback" role="status">✦ За каждый верный ответ — 100 очков. Математика важнее скорости.</div>`}<div class="play-actions"><span class="micro">${state.custom?'Авторская викторина · 1 вопрос':'5 проверенных демонстрационных вопросов'}</span>${state.custom?'<button type="button" class="action ghost" data-demo>Демо-вопросы</button>':''}<button type="button" class="action" data-next ${state.quizAnswered?'':'disabled'}>${state.quizIndex===total()-1?'Результат →':'Следующий вопрос →'}</button></div></div>`}
function viewDomino(){const placed=state.dominoPlaced.map(i=>domino[i]);const open=domino.map((d,i)=>({...d,i})).filter(x=>!state.dominoPlaced.includes(x.i));return `<div class="panel">${hud('▦ DOMINO CHAIN','Эквивалентные значения · 5–8 класс')}<div class="chain-head"><strong>Собери цепочку равенств</strong><span>Начни с числа 6</span></div><div class="chain" aria-label="Собранная цепочка"><span class="start">6</span>${placed.map(x=>`<span class="arrow">›</span><div class="bone locked"><span>${esc(x.left)}</span><span>${esc(x.right)}</span></div>`).join('')}${!placed.length?'<span class="micro">← Выбери первую костяшку внизу</span>':''}</div><p class="domino-instruction">Найди костяшку, левая половина которой равна <strong style="color:#7ef1dd">${state.dominoNeeded}</strong>. Затем продолжи цепь по новому значению справа.</p><div class="bones">${open.map(d=>`<button type="button" class="bone" data-bone="${d.i}" aria-label="${esc(d.left)} — ${esc(d.right)}"><span>${esc(d.left)}</span><span>${esc(d.right)}</span></button>`).join('')}</div><div class="feedback" role="status">✦ Щёлкни по подходящей костяшке. Ошибок: ${state.dominoMistakes}. За верное соединение — 100 очков.</div><div class="play-actions"><button type="button" class="action ghost" data-reset>Начать сначала</button><span class="micro">Собрано ${placed.length} из ${domino.length} костяшек</span></div></div>`}
function viewClimb(){let c=climb[Math.min(state.climbStep,climb.length-1)];return `<div class="panel">${hud('△ SUMMIT CLIMB','Арифметика, степени, уравнения · 5–8 класс')}<div class="summit-wrap" aria-label="Маршрут по скале"><div class="peak"></div><div class="mount-title">△ МАРШРУТ: ВЕРШИНА ЗНАНИЙ</div><div class="mount-badge">Высота: ${state.climbStep} / ${climb.length}</div><div class="summit-path">${climb.map((_,i)=>`<div class="ledge ${i<state.climbStep?'done':i===state.climbStep?'current':''}" style="--i:${i}">${i+1}</div>`).join('')}</div><div class="climber" style="--step:${Math.min(state.climbStep,5)}" aria-hidden="true">◆</div></div><div class="question-card"><span class="mini">СТУПЕНЬ ${state.climbStep+1} / ${climb.length}</span><div class="math">${esc(c.q)}</div><span class="hint">Выбери уступ с правильным ответом</span></div><div class="summit-answer">${c.o.map((o,i)=>`<button type="button" data-climb="${i}" class="answer ${state.climbAnswered?(i===c.a?'correct':state.climbSelected===i?'wrong':''):''}" ${state.climbAnswered?'disabled':''}>${esc(o)}</button>`).join('')}</div>${state.climbAnswered?`<div class="feedback ${state.climbSelected===c.a?'good':'bad'}" role="status">${state.climbSelected===c.a?'✓ Верно! Ты поднимаешься выше.':'↻ Ошибка — спускаешься на одну ступень.'} ${esc(c.why)}</div>`:`<div class="feedback" role="status">✦ Правильный ответ поднимает на ступень. Ошибка возвращает на одну ниже.</div>`}<div class="play-actions"><span class="micro">${state.climbMistakes} ошибок · без таймера</span><button type="button" class="action" data-next-climb ${state.climbAnswered?'':'disabled'}>${state.climbSelected===c.a&&state.climbStep===climb.length-1?'Результат →':'Продолжить →'}</button></div></div>`}
function viewWin(){const w=state.win;return `<div class="panel">${hud(w.title,'Финиш · Математический вызов пройден')}<div class="victory"><div><div class="trophy" aria-hidden="true">✦</div><div class="eyebrow" style="justify-content:center"><i></i> МИССИЯ ВЫПОЛНЕНА</div><h2>Уровень пройден!</h2><p>${esc(w.message)}</p><div class="victory-stats"><div class="stat"><strong>${w.points}</strong><span>очки</span></div><div class="stat"><strong>${w.correct}/${w.total}</strong><span>этапы</span></div><div class="stat"><strong>${w.misses}</strong><span>ошибки</span></div></div><div class="victory-actions"><button type="button" class="action" data-reset>Играть ещё ↻</button><button type="button" class="action ghost" data-go="author">Создать свою игру ✦</button></div></div></div></div>`}
function viewAuthor(){return `<div class="panel"><div class="hud"><div><div class="hud-label"><span class="light"></span>✦ СТУДИЯ АВТОРА</div><div class="hud-sub">Ученик создаёт математическую игру самостоятельно</div></div><div class="stat"><strong>1</strong><span>вопрос</span></div></div><div class="track"><div style="width:38%"></div></div><div class="question-card"><div class="mini">ОТ ИДЕИ К ИГРЕ</div><div class="math">Создай свой математический вызов</div><div class="hint">Заполни вопрос, четыре ответа и отметь правильный.</div></div><form id="author-form"><div class="author-grid"><div class="input-wrap full"><label for="my-question">Математический вопрос</label><input class="field" id="my-question" maxlength="180" required placeholder="Например: 2³ + 4 = ?" value="${esc(draft.q)}"></div>${draft.o.map((x,i)=>`<div class="input-wrap"><label for="opt${i}">Ответ ${String.fromCharCode(65+i)}</label><input class="field" id="opt${i}" maxlength="70" required value="${esc(x)}" placeholder="Вариант ${String.fromCharCode(65+i)}"></div>`).join('')}<div class="input-wrap full"><label for="correct-answer">Какой ответ правильный?</label><select class="field" id="correct-answer">${draft.o.map((_,i)=>`<option value="${i}" ${draft.a===i?'selected':''}>${String.fromCharCode(65+i)} — вариант ${i+1}</option>`).join('')}</select></div></div><div class="author-proof"><strong>🧠 Автор отвечает за математику.</strong> Прототип сохраняет выбранный ответ, но не доказывает его правильность. Перед публикацией задания проверьте решение вместе с учителем.</div><div class="play-actions"><span class="micro">Черновик сохраняется только в этом браузере</span><button class="action" type="submit">▶ Сохранить и сыграть</button></div></form></div>`}
function reset(which){state.win=null;if(which==='quiz'){state.quizIndex=0;state.quizScore=0;state.quizMistakes=0;state.quizSelected=null;state.quizAnswered=false}else if(which==='domino'){state.dominoNeeded=6;state.dominoPlaced=[];state.dominoMistakes=0}else if(which==='climb'){state.climbStep=0;state.climbMistakes=0;state.climbScore=0;state.climbAnswered=false;state.climbSelected=null}render()}
function switchGame(name){if(name==='author'){state.win=null;state.game='author';render();return}if(!['quiz','domino','climb'].includes(name))return;state.game=name;state.win=null;if(name==='quiz'&&!state.custom&&state.quizIndex>=bank.length)reset('quiz');else render()}
function answerQuiz(i){if(state.quizAnswered)return;const q=question();state.quizSelected=i;state.quizAnswered=true;if(i===q.answer){state.quizScore+=100}else{state.quizMistakes++}render()}
function nextQuiz(){if(!state.quizAnswered)return;if(state.quizIndex>=total()-1){state.win={title:'◈ QUIZ PULSE',points:state.quizScore,correct:total()-state.quizMistakes,total:total(),misses:state.quizMistakes,message:'Ты прошёл викторину! Проверь свои ответы и попробуй ещё одну игровую механику.'};render();return}state.quizIndex++;state.quizAnswered=false;state.quizSelected=null;render()}
function chooseDomino(i){if(state.dominoPlaced.includes(i))return;const d=domino[i];if(!d)return;if(d.value!==state.dominoNeeded){state.dominoMistakes++;notify('Не подходит: '+d.left+' ≠ '+state.dominoNeeded);render();return}state.dominoPlaced.push(i);state.dominoNeeded=d.next;if(state.dominoPlaced.length===domino.length){state.win={title:'▦ DOMINO CHAIN',points:score(),correct:domino.length,total:domino.length,misses:state.dominoMistakes,message:'Цепочка равенств собрана! Ты отлично распознаёшь эквивалентные выражения.'}}render()}
function answerClimb(i){if(state.climbAnswered)return;state.climbSelected=i;state.climbAnswered=true;if(i===climb[state.climbStep].a){state.climbScore+=100}else{state.climbMistakes++}render()}
function nextClimb(){if(!state.climbAnswered)return;const correct=state.climbSelected===climb[state.climbStep].a;if(correct){state.climbStep++}else{state.climbStep=Math.max(0,state.climbStep-1)}state.climbAnswered=false;state.climbSelected=null;if(state.climbStep>=climb.length){state.win={title:'△ SUMMIT CLIMB',points:state.climbScore,correct:climb.length,total:climb.length,misses:state.climbMistakes,message:'Вершина достигнута! Каждый верный шаг в математике поднимает тебя выше.'}}render()}
app.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.hasAttribute('data-go')){switchGame(button.dataset.go);return}if(button.hasAttribute('data-answer')){answerQuiz(+button.dataset.answer);return}if(button.hasAttribute('data-bone')){chooseDomino(+button.dataset.bone);return}if(button.hasAttribute('data-climb')){answerClimb(+button.dataset.climb);return}if(button.hasAttribute('data-next')){nextQuiz();return}if(button.hasAttribute('data-demo')){state.custom=null;reset('quiz');return}if(button.hasAttribute('data-next-climb')){nextClimb();return}if(button.hasAttribute('data-reset')){reset(state.game);return}});
app.addEventListener('change',e=>{if(e.target.id==='theme'){state.theme=e.target.value;saveStore('neoarcade:theme',state.theme);render()}if(e.target.id==='age'){state.age=e.target.value;saveStore('neoarcade:age',state.age);render()}});
app.addEventListener('input',e=>{if(e.target.id==='my-question')draft.q=e.target.value;const match=e.target.id.match(/^opt(\d)$/);if(match)draft.o[+match[1]]=e.target.value});
app.addEventListener('change',e=>{if(e.target.id==='correct-answer')draft.a=+e.target.value});
app.addEventListener('submit',e=>{if(e.target.id!=='author-form')return;e.preventDefault();const d={q:draft.q.trim(),o:draft.o.map(x=>x.trim()),a:draft.a};if(!d.q||d.o.some(x=>!x)){notify('Заполни все поля');return}if(new Set(d.o.map(x=>x.toLocaleLowerCase('ru'))).size!==4){notify('Все 4 ответа должны различаться');return}state.custom=d;saveStore('neoarcade:custom',JSON.stringify(d));state.game='quiz';reset('quiz');notify('Игра создана! Попробуй свой вопрос.')});
window.addEventListener('error',e=>{console.error(e.error||e.message);app.innerHTML='<div style="padding:30px;color:white"><h2>Не удалось открыть игру</h2><p>Обновите страницу. Если ошибка повторится, сообщите разработчику.</p></div>'});
render();
})();
</script></body></html>
