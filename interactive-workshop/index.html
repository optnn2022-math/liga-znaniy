 #858acb;min-height:74px;min-width:120px;max-width:245px;overflow:hidden;border-radius:13px;background:white;color:#33416e;box-shadow:0 5px 11px #48519c16;font-size:13px;font-weight:850;overflow-wrap:anywhere}.domino-tile>span{flex:1;min-width:60px;display:grid;place-items:center;padding:9px}.domino-tile>span+span{border-left:2px solid #aab0d8;background:#f0f2ff}.domino-tile.placed{border-color:#37a984;background:#e7faf4}.domino-tile.placed>span+span{background:#daf8ef;border-color:#50bba1}.domino-tiles .domino-tile:hover{border-color:#504bcc;background:#f6f5ff}.tower-stage{min-height:240px;border:1px solid #e0e5fa;border-radius:19px;overflow:hidden;background:linear-gradient(#ecf3ff,#fff8ed);display:flex;flex-direction:column;justify-content:space-between;padding:24px 10px 0}.tower-choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}.falling-block{width:clamp(85px,22%,130px);min-height:72px;border:2px solid #5765c9;border-radius:12px;background:linear-gradient(130deg,#7889f5,#5665d5);color:#fff;font-size:19px;font-weight:950;box-shadow:inset 0 -9px 0 #0002,0 7px 0 #3e4da5;animation:block-enter .35s ease both;animation-delay:calc(var(--delay) * 80ms);overflow-wrap:anywhere}.tower-floor{border-top:5px solid #ab9c8a;margin-top:35px;text-align:center;padding:6px;background:#eee7df;color:#625d65;font-size:11px;font-weight:850;min-height:59px}.tower-brick{display:inline-grid;place-items:center;background:#e88b63;border:1px solid #c66c4d;width:43px;height:32px;border-radius:5px;font-size:13px;margin:0 2px 5px}.climb-scene{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;background:linear-gradient(145deg,#e9faff,#f3edff);border-radius:17px;padding:17px}.climb-route{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:7px;max-width:350px;min-width:0}.climb-step{border-radius:10px;background:#d2dcf4;border:2px solid #a3b3d9;padding:9px 13px;font-size:12px;font-weight:850;max-width:calc(100% - 8px);white-space:nowrap}.climb-step.done{background:#bcf3e0;border-color:#5db49e}.climb-peak{border-radius:11px;padding:10px 13px;background:#645acf;color:#fff;font-size:12px;font-weight:900;align-self:flex-end}.climb-challenge{background:white;padding:15px;border:1px solid #dfe5f5;border-radius:17px;min-width:0}.climb-choice{display:block;width:100%;border:1px solid #c9d4ef;border-radius:12px;padding:12px;margin:9px 0;color:#3a4782;background:#f7faff;font-weight:900;font-size:15px;text-align:left}.snake-grid{width:min(100%,390px);margin:15px auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#b1c9db;padding:5px;gap:4px;border-radius:14px}.snake-cell{aspect-ratio:1;background:#f2fbff;border-radius:8px;display:grid;place-items:center;min-width:0;overflow:hidden;color:#253b63;font-weight:900;font-size:clamp(11px,3vw,17px)}.snake-cell:nth-child(2n){background:#e4f5f7}.snake-cell.head{background:#9be3b7;font-size:24px}.snake-cell.body{background:#46b891;color:#fff;font-size:21px}.snake-cell.food{background:#fce8a9;border:1px solid #f2bb56;word-break:break-all;padding:2px}.snake-controls{display:grid;justify-items:center;gap:5px}.snake-controls>div{display:flex;gap:6px}.snake-controls button{border:1px solid #b6c1e6;border-radius:11px;background:#eff2ff;color:#3d49ac;font-size:21px;font-weight:900;min-width:53px;height:45px}.arcade-win{background:linear-gradient(110deg,#ecfff4,#e7f8ff);padding:40px;border:1px solid #cdf0e1;border-radius:17px;text-align:center;font-size:56px}.arcade-win h3{font-size:24px;margin:14px 0 6px}.arcade-win p{font-size:14px;color:#4f6a81}.arcade-win.fail{background:#fff2ed;border-color:#f8d7c9}
@keyframes block-enter{from{opacity:.5;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:670px){.mode-selector{grid-template-columns:repeat(2,minmax(0,1fr))}.climb-scene{grid-template-columns:1fr}.climb-route{min-height:200px}.domino-tile{min-width:95px;font-size:12px}.domino-tile>span{min-width:48px}.arcade-mode-chips{max-width:100%}}
@media(prefers-reduced-motion:reduce){.falling-block{animation:none}.arcade-progress>div{transition:none}}

<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script>
/* Интерактивная мастерская v0.1. No external dependencies. */
(() => {
'use strict';
const STORAGE_KEY = 'interactive-workshop-v01';
const TYPE = {
  quiz:{label:'Викторина',icon:'❔',description:'Выбрать единственный правильный ответ'},
  match:{label:'Соедини пары',icon:'🔗',description:'Найти соответствия между двумя колонками'},
  sort:{label:'Сортировка',icon:'🧩',description:'Распределить элементы по категориям'},
  order:{label:'Последовательность',icon:'📐',description:'Расставить этапы в правильном порядке'},
  input:{label:'Числовой ответ',icon:'🔢',description:'Ввести число или дробь с умной проверкой'},
  arcade:{label:'Математические игры',icon:'🎮',description:'Домино, башня, змейка и скалолазание на одном наборе задач'}
};
const starterTasks = [
  {id:'math-01',type:'quiz',title:'Сложение целых чисел',topic:'Отрицательные числа',grade:'6',level:'Базовый',question:'Вычисли: −3 + 5',options:[{text:'−8',correct:false},{text:'2',correct:true},{text:'−2',correct:false},{text:'8',correct:false}],hint:'На числовой прямой от числа −3 сделай пять шагов вправо.',explanation:'−3 + 5 = 2: положительных единиц на две больше.'},
  {id:'math-02',type:'match',title:'Соответствие математических записей',topic:'Дроби',grade:'5',level:'Базовый',question:'Соедини обыкновенные дроби с десятичными.',pairs:[{left:'1/2',right:'0,5'},{left:'1/4',right:'0,25'},{left:'3/4',right:'0,75'},{left:'1/5',right:'0,2'}],hint:'Чтобы получить десятичную дробь, раздели числитель на знаменатель.',explanation:'Каждую дробь можно записать десятичной формой.'},
  {id:'math-03',type:'sort',title:'Положительные и отрицательные числа',topic:'Отрицательные числа',grade:'6',level:'Базовый',question:'Распредели числа в соответствующие группы.',categories:['Положительные','Отрицательные'],cards:[{text:'−5',category:'Отрицательные'},{text:'3/4',category:'Положительные'},{text:'2',category:'Положительные'},{text:'−1,2',category:'Отрицательные'},{text:'0,8',category:'Положительные'}],hint:'Положительные числа больше нуля, отрицательные — меньше нуля.',explanation:'Число 0 не относится ни к положительным, ни к отрицательным.'},
  {id:'math-04',type:'order',title:'Решение линейного уравнения',topic:'Уравнения',grade:'7',level:'Повышенный',question:'Расположи этапы решения уравнения 3(x − 2) = 12.',order:['Раскрыть скобки: 3x − 6 = 12','Перенести свободный член: 3x = 18','Разделить на 3: x = 6','Проверить подстановкой: 3(6 − 2) = 12'],hint:'Сначала выполняют тождественные преобразования, в конце — проверку.',explanation:'Корень уравнения x = 6.'},
  {id:'math-05',type:'input',title:'Вычисление с дробями',topic:'Дроби',grade:'6',level:'Повышенный',question:'Вычисли: −3/4 + 1/2. Запиши ответ дробью.',answer:'-1/4',hint:'Приведи дроби к знаменателю 4 и обрати внимание на знак.',explanation:'−3/4 + 2/4 = −1/4. Ответы −0,25 и −1/4 также равны.'},
  {id:'math-06',type:'quiz',title:'Сумма углов треугольника',topic:'Геометрия',grade:'7',level:'Базовый',question:'Чему равна сумма внутренних углов любого треугольника?',options:[{text:'90°',correct:false},{text:'360°',correct:false},{text:'180°',correct:true},{text:'270°',correct:false}],hint:'Вспомни теорему о сумме углов треугольника.',explanation:'Сумма внутренних углов треугольника равна 180°.'}
];
const ARCADE_MODES={domino:{label:'Домино',icon:'🁣'},tower:{label:'Собери башню',icon:'🧱'},snake:{label:'Змейка',icon:'🐍'},climb:{label:'Поднимись на вершину',icon:'🧗'}};
const arcadeSamples=[
 {id:'arcade-02',type:'arcade',game:'snake',author:'Пример мастерской',title:'Змейка: арифметический марафон',topic:'Арифметика',grade:'2',level:'Базовый',question:'Собери правильные ответы и вырасти!',items:[{prompt:'7 + 5',answer:'12',wrong:['11','13']},{prompt:'18 − 9',answer:'9',wrong:['7','10']},{prompt:'6 · 3',answer:'18',wrong:['16','21']},{prompt:'24 : 4',answer:'6',wrong:['4','8']}],hint:'Выполняй действия по порядку.',explanation:'Ты справился с арифметическим марафоном!'},
 {id:'arcade-06',type:'arcade',game:'domino',author:'Пример мастерской',title:'Домино: дроби и проценты',topic:'Дроби и проценты',grade:'6',level:'Повышенный',question:'Построй цепочку от первой задачи до финиша.',items:[{prompt:'1/2 в десятичной записи',answer:'0,5',wrong:['0,2','0,25']},{prompt:'25% в виде дроби',answer:'1/4',wrong:['1/5','1/3']},{prompt:'3/5 в процентах',answer:'60%',wrong:['30%','50%']},{prompt:'0,125 в виде дроби',answer:'1/8',wrong:['1/4','1/6']}],hint:'Вспомни связь обыкновенных дробей, десятичных дробей и процентов.',explanation:'Каждая костяшка связана с правильным ответом.'},
 {id:'arcade-08',type:'arcade',game:'tower',author:'Пример мастерской',title:'Башня квадратных корней',topic:'Квадратные корни',grade:'8',level:'Базовый',question:'Убирай правильные блоки, не давая башне вырасти.',items:[{prompt:'√49',answer:'7',wrong:['6','8']},{prompt:'√81',answer:'9',wrong:['8','10']},{prompt:'√144',answer:'12',wrong:['14','11']},{prompt:'√36 + √16',answer:'10',wrong:['7','8']}],hint:'Арифметический квадратный корень неотрицателен.',explanation:'Ты разобрал башню.'},
 {id:'arcade-10',type:'arcade',game:'climb',author:'Пример мастерской',title:'Вершина тригонометрии',topic:'Тригонометрия',grade:'10',level:'Повышенный',question:'Доберись до вершины, выбирая верные значения.',items:[{prompt:'sin(30°)',answer:'1/2',wrong:['1','0']},{prompt:'cos(120°)',answer:'−1/2',wrong:['0','−1']},{prompt:'sin(90°)',answer:'1',wrong:['0','−1']},{prompt:'cos(180°)',answer:'−1',wrong:['0','1']}],hint:'Используй единичную окружность.',explanation:'Пик тригонометрии покорён!'}
];
const starterQuests=[{id:'quest-01',title:'Тайна математического портала',description:'Три испытания: раскрой код, рассортируй артефакты и найди числовой ключ.',taskIds:['math-01','math-03','math-05'],theme:'🚀'}];
const app=document.getElementById('app');
const deepCopy = (x)=>JSON.parse(JSON.stringify(x));
const escapeHTML=(x)=>String(x ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=(x)=>String(x||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const id=()=> 'item-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const shuffle=(xs)=>{let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(a.length>1&&a.every((x,i)=>x===xs[i]))[a[0],a[1]]=[a[1],a[0]];return a;};
const saved=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}})();
const state={
  tasks:Array.isArray(saved?.tasks)?saved.tasks:deepCopy([...starterTasks,...arcadeSamples]),
  quests:Array.isArray(saved?.quests)?saved.quests:deepCopy(starterQuests),
  tab:'home',filter:'all',search:'',editId:null,draft:null,questDraft:null,studentDraft:null,
  play:null,questRun:null,err:'',
};
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schemaVersion:1,tasks:state.tasks,quests:state.quests}))}catch{toast('Локальное хранилище недоступно. Используйте экспорт JSON.')}}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3600)}
function getTask(x){return state.tasks.find(t=>t.id===x)}
function getQuest(x){return state.quests.find(q=>q.id===x)}
function typeName(t){return TYPE[t]?.label||t}
function tIcon(t){return TYPE[t]?.icon||'📘'}
function tag(level){return `<span class="tag ${level==='Базовый'?'teal':level==='Олимпиадный'?'amber':''}">${escapeHTML(level||'Базовый')}</span>`}
function navLink(tab,emoji,name){return `<button class="nav-button ${state.tab===tab?'active':''}" data-action="nav" data-tab="${tab}"><span class="emoji">${emoji}</span><span>${name}</span></button>`}
function layout(content){return `<div class="layout"><aside class="sidebar"><a class="brand" href="#home" data-action="nav" data-tab="home"><span class="brand-symbol">✦</span><span><strong>Интерактивная<br>мастерская</strong><small>СТУДИЯ ОБУЧАЮЩИХ ИГР</small></span></a><div class="side-title">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav" aria-label="Разделы конструктора">${navLink('home','🏠','Главная')}${navLink('student','🎓','Я создаю игру')}${navLink('library','📚','Библиотека заданий')}${navLink('builder','🪄','Конструктор')}${navLink('quests','🗺️','Квесты')}${navLink('quest-builder','🛠️','Редактор квестов')}</nav><div class="sidebar-foot"><div class="sidebar-note"><strong>✨ Прототип 0.2</strong><p>Ученик создаёт свои игры. Добавлены домино, башня, змейка и подъём на вершину.</p></div></div></aside><main class="main"><div class="topline"><div class="breadcrumb">Мастерская / ${escapeHTML(({home:'Обзор',student:'Ученик — автор',library:'Задания',builder:'Конструктор',play:'Игровой режим',quests:'Приключения','quest-builder':'Конструктор квестов'})[state.tab]||'Студия')}</div><div class="top-actions"><span class="pill">✦ Авторский конструктор</span><button class="icon-button" title="Экспортировать задания и квесты" aria-label="Экспорт JSON" data-action="export">⇩</button><button class="icon-button" title="Импортировать JSON" aria-label="Импорт JSON" data-action="import">⇧</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></div>${content}<div class="footer-note">Интерактивная мастерская · v0.2 · Прототип работает автономно, без аккаунта и сервера</div></main></div>`}
function showHome(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">✦ СОЗДАВАЙ • ИГРАЙ • ИССЛЕДУЙ</div><h2>Не только решай — <span style="color:#caffeb">создавай математику сам!</span></h2><p>1–11 класс: придумай задачу, создай ловушки и играй в домино, башню, змейку или восхождение. Учителю доступен расширенный редактор.</p><div class="hero-buttons"><button class="btn btn-light" data-action="nav" data-tab="student">🎓 Создать свою игру</button><button class="btn btn-light" data-action="new">＋ Создать задание</button><button class="btn btn-ghost" data-action="nav" data-tab="quests">▶ Играть в квест</button></div></div><div class="hero-art" aria-hidden="true">🧩</div></div><div class="stat-grid"><div class="stat"><div class="stat-icon">📚</div><div><strong>${state.tasks.length}</strong><small>заданий в банке</small></div></div><div class="stat"><div class="stat-icon">🧠</div><div><strong>${Object.keys(TYPE).length}</strong><small>видов заданий</small></div></div><div class="stat"><div class="stat-icon">🗺️</div><div><strong>${state.quests.length}</strong><small>квестов создано</small></div></div><div class="stat"><div class="stat-icon">🔒</div><div><strong>0 ₽</strong><small>внешних сервисов</small></div></div></div><div class="section-head"><div><h2>Выбери механику</h2><p>Каждая механика имеет собственный редактор и игровой режим</p></div><button class="subtle-link" data-action="nav" data-tab="library">Мои задания →</button></div><div class="cards-grid">${Object.entries(TYPE).map(([key,x],i)=>`<div class="template-card"><div class="template-art" style="background:${['#f0efff','#e8faf7','#fff4e6','#eaf5ff','#fff0f5'][i]}">${x.icon}</div><h3>${x.label}</h3><p>${x.description}</p><button class="btn btn-outline btn-small" data-action="new" data-type="${key}">Создать ↗</button></div>`).join('')}</div><div class="section-head"><div><h2>Начните с примера</h2><p>Работающие упражнения, которые можно редактировать</p></div></div><div class="task-list">${state. function parseDraftFromForm(){const form=document.getElementById('task-form');if(!form)return getDraft();const x=new FormData(form),old=getDraft();const d={...old,type:String(x.get('type')),title:String(x.get('title')||'').trim(),topic:String(x.get('topic')||'').trim(),grade:String(x.get('grade')||'6'),level:String(x.get('level')||'Базовый'),question:String(x.get('question')||'').trim(),hint:String(x.get('hint')||'').trim(),explanation:String(x.get('explanation')||'').trim()};if(d.type==='quiz')d.options=nl(x.get('options')).map(r=>({text:r.replace(/^\*/,'').trim(),correct:r.startsWith('*')}));if(d.type==='match')d.pairs=nl(x.get('pairs')).map(r=>{const at=r.indexOf('|');return {left:at<0?r.trim():r.slice(0,at).trim(),right:at<0?'':r.slice(at+1).trim()}});if(d.type==='sort'){d.categories=nl(x.get('categories'));d.cards=nl(x.get('cards')).map(r=>{const at=r.indexOf('|');return {text:at<0?r.trim():r.slice(0,at).trim(),category:at<0?'':r.slice(at+1).trim()}})}if(d.type==='order')d.order=nl(x.get('order'));if(d.type==='input')d.answer=String(x.get('answer')||'').trim();if(d.type==='arcade'){d.game=String(x.get('game')||'domino');d.items=nl(x.get('items')).map(r=>{const fields=r.split('|').map(z=>z.trim());return {prompt:fields[0]||'',answer:fields[1]||'',wrong:fields.slice(2)}})}return d}
function validateTask(d){if(!TYPE[d.type])return 'Неизвестная игровая механика.';if(!d.title||!d.question)return 'Заполните название и формулировку задания.';if(d.title.length>130||d.question.length>900)return 'Слишком длинный заголовок или условие.';if(d.type==='quiz'&&(d.options.length<2||d.options.some(o=>!o.text)||d.options.filter(o=>o.correct).length!==1))return 'В викторине необходимо минимум 2 варианта и ровно один правильный (*).';if(d.type==='match'&&(d.pairs.length<2||d.pairs.some(p=>!p.left||!p.right)))return 'Для соединения нужно минимум две полные пары «левый | правый».';if(d.type==='sort'&&(d.categories.length<2||new Set(d.categories).size!==d.categories.length||d.cards.length<2||d.cards.some(p=>!p.text||!d.categories.includes(p.category))))return 'Сортировка: минимум две разные категории и два элемента; названия категорий должны совпадать.';if(d.type==='order'&&(d.order.length<2||d.order.some(p=>!p)))return 'Для последовательности добавьте минимум два шага.';if(d.type==='input'&&!d.answer)return 'Введите правильный ответ.';if(d.type==='arcade')return validateArcade(d);return ''}

function answerEqual(a,b){return evaluateInput(String(a).trim(),String(b).trim()).correct}

// Safe restricted arithmetic parser: +, −, ×, ÷, :, /, ^ and brackets.
// Only expressions that can be parsed unambiguously are verified; no eval/Function.
function arithmeticExpressionValue(raw){
 let expr=String(raw||'').trim().replace(/−/g,'-').replace(/[×·]/g,'*').replace(/[÷:]/g,'/').replace(/,/g,'.');
 if(!expr||expr.length>100||/[^0-9\s.+\-*/()^]/.test(expr))return null;

 let i=0;
 function primary(){if(t[i]==='('){i++;let v=expression();if(t[i++]!==')')throw Error('missing )');return v}let z=t[i++];if(!z||!/^\d+(?:\.\d*)?$|^\.\d+$/.test(z))throw Error('number');return Number(z)}

 function expression(){let v=term();while(t[i]==='+'||t[i]==='-'){const op=t[i++],b=term();v=op==='+'?v+b:v-b}return v}
 try{let v=expression();return i===t.length&&Number.isFinite(v)&&Math.abs(v)<1e12?v:null}catch{return null}
}
function validateArcade(d){
 if(!ARCADE_MODES[d.game])return 'Неизвестный игровой режим.';
 if(!Array.isArray(d.items)||d.items.length<2||d.items.length>30)return 'Для игры нужно от 2 до 30 заданий.';
 for(const [i,c] of d.items.entries()){
  if(!c.prompt||!c.answer||!Array.isArray(c.wrong)||c.wrong.length!==2||c.wrong.some(x=>!x))return 'Для каждого испытания нужны условие, верный ответ и две ловушки (строка '+(i+1)+').';
  if([c.answer,...c.wrong].some(x=>x.length>100)||c.prompt.length>250)return 'Слишком длинный вопрос или ответ.';
  if(answerEqual(c.answer,c.wrong[0])||answerEqual(c.answer,c.wrong[1])||answerEqual(c.wrong[0],c.wrong[1]))return 'Ответы должны различаться, включая равные дроби и десятичные записи (строка '+(i+1)+').';

 }
 for(let i=0;i<d.items.length;i++)for(let j=i+1;j<d.items.length;j++)if(answerEqual(d.items[i].answer,d.items[j].answer))return 'Для домино ответы разных задач должны отличаться. Проверьте строки '+(i+1)+' и '+(j+1)+'.';

}

function numericValue(raw){const s=String(raw||'').trim().replace(/\u2212/g,'-').replace(/,/g,'.').replace(/\s/g,'');if(!s)return null;const atom='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';const dec=new RegExp('^'+atom+'

function studentStudio(){const d=state.studentDraft||(state.studentDraft=newStudentDraft());return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow" style="color:#575dc6">🎓 УЧЕНИК — СОЗДАТЕЛЬ</div><h1 class="h1">Придумай <span class="gradient-text">свою игру</span></h1><p>Математика 1–11 классов. Ты автор задач, ответов и хитрых ловушек!</p></div><button class="btn btn-outline" data-action="student-example">⚡ Показать пример</button></div><div class="builder-grid"><section class="panel"><form id="student-form" novalidate><div class="form-group"><label class="field-label">Как назовём твою игру?</label><input name="title" class="field" maxlength="130" value="${escapeHTML(d.title)}" required data-student-field="title"></div><div class="form-row"><div class="form-group"><label class="field-label">Класс</label><select class="field" data-student-field="grade" name="grade">${Array.from({length:11},(_,i)=>String(i+1)).map(g=>`<option value="${g}" ${d.grade===g?'selected':''}>${g} класс</option>`).join('')}</select></div><div class="form-group"><label class="field-label">Тема</label><input name="topic" class="field" value="${escapeHTML(d.topic)}" data-student-field="topic" maxlength="110"></div></div><div class="form-group"><label class="field-label">Выбери игровое оформление</label><div class="mode-selector">${Object.entries(ARCADE_MODES).map(([key,m])=>`<button type="button" class="mode-tile ${d.game===key?'selected':''}" data-action="student-mode" data-mode="${key}" aria-pressed="${d.game===key}"><span>${m.icon}</span>${m.label}</button>`).join('')}</div></div><div class="divider"></div><h2>Придумай испытания</h2><p class="helper">В каждой карточке напиши математический вопрос, правильный ответ и два неправильных (ловушки). Важно: не повторяй правильный ответ в разных карточках — он нужен для домино.</p>${d.items.map((item,i)=>`<div class="student-stage"><div class="student-stage-head"><strong>Задача ${i+1}</strong>${d.items.length>2?`<button type="button" class="btn btn-outline btn-small" data-action="student-remove" data-index="${i}">Убрать</button>`:''}</div><div class="form-group"><label class="field-label">Математический вопрос</label><input class="field" data-student-index="${i}" data-student-key="prompt" value="${escapeHTML(item.prompt)}" placeholder="Например: 5 × 3"></div><div class="form-group"><label class="field-label">Правильный ответ</label><input class="field" data-student-index="${i}" data-student-key="answer" value="${escapeHTML(item.answer)}" placeholder="15"></div><div class="form-row"><div class="form-group"><label class="field-label">Ловушка 1</label><input class="field" data-student-index="${i}" data-student-key="wrong0" value="${escapeHTML(item.wrong[0])}" placeholder="12"></div><div class="form-group"><label class="field-label">Ловушка 2</label><input class="field" data-student-index="${i}" data-student-key="wrong1" value="${escapeHTML(item.wrong[1])}" placeholder="18"></div></div></div>`).join('')}<div class="form-actions"><button type="button" class="btn btn-outline" data-action="student-add" ${d.items.length>=30?'disabled':''}>＋ Добавить задачу</button></div><div class="form-group"><label class="field-label">Подсказка для игрока (необязательно)</label><input class="field" data-student-field="hint" value="${escapeHTML(d.hint)}" placeholder="Как решать эти задачи?"></div>${state.err?`<div class="validation-error" role="alert">${escapeHTML(state.err)}</div>`:''}<div class="form-actions"><button type="submit" class="btn btn-primary">▶ Сохранить и сыграть</button></div></form></section><aside class="panel"><h2>⭐ Как стать автором?</h2><div class="callout"><strong>1. Придумай пример</strong><br>Не слишком простой и не слишком сложный.</div><div class="callout"><strong>2. Создай ловушки</strong><br>Подумай, в чём другие могут ошибиться.</div><div class="callout"><strong>3. Проверь свою игру</strong><br>Поиграй во все 4 механики и найди неточности.</div><div class="callout"><strong>4. Поделись позже</strong><br>Публикация в классе появится после подключения кабинетов и проверки учителем.</div><div class="notice">Простые арифметические выражения система перепроверяет при сохранении. Для уравнений, геометрии, тригонометрии и текстовых условий правильность ответа пока подтверждает сам автор или учитель.</div></aside></div>`}
function saveStudent(){const d=state.studentDraft;if(!d)return;const t={id:id(),type:'arcade',author:'Ученик',title:d.title.trim(),grade:d.grade,topic:d.topic.trim(),game:d.game,level:'Базовый',question:'Пройди игру, которую ты придумал!',items:deepCopy(d.items),hint:d.hint.trim(),explanation:'Поздравляем! Все задания пройдены.'};const err=validateTask(t);if(err){state.err=err;render();return}state.tasks.unshift(t);state.studentDraft=null;state.err='';persist();startPlay(t.id,'direct',t.game);toast('Игра создана! Проверь её сам и исправь ошибки, если найдёшь.');}
function startPlay(taskId,context='direct',overrideGame=null){const t=getTask(taskId);if(!t){toast('Задание не найдено');return}state.play={id:taskId,context,chosen:null,selectedLeft:null,matches:{},sortSelected:null,assignments:{},rightOrder:shuffle([...Array((t.pairs||[]).length).keys()]),order:shuffle([...Array((t.order||[]).length).keys()]),inputValue:'',attempts:0,result:null,feedback:null,earned:0,game:overrideGame||t.game||'domino',stage:0,chain:[],pile:0,snake:[14],foods:[],snakeDirection:1,stageChoices:shuffle([0,1,2]),failed:false};if(t.type==='arcade'){state.play.tileOrder=shuffle([...Array(t.items.length).keys()]);seedSnakeFoods(state.play,t)}state.tab='play';render()}
function playQuiz(t,p){return `<div class="choice-list">${t.options.map((x,i)=>`<button class="choice ${p.chosen===i?'selected':''}" data-action="choose" data-index="${i}" ${p.result?.correct?'disabled':''}><span class="circle-option">${p.chosen===i?'✓':String.fromCharCode(65+i)}</span><span>${escapeHTML(x.text)}</span></button>`).join('')}</div>`}
function playMatch(t,p){const left=t.pairs.map((x,i)=>`<button class="pair-item ${p.selectedLeft===i?'selected':''} ${p.matches[i]!==undefined?'matched':''}" data-action="match-left" data-index="${i}" ${p.matches[i]!==undefined||p.result?.correct?'disabled':''}>${escapeHTML(x.left)} ${p.matches[i]!==undefined?'✔':''}</button>`).join('');const right=p.rightOrder.map(j=>`<button class="pair-item right ${Object.values(p.matches).includes(j)?'matched':''}" data-action="match-right" data-index="${j}" ${Object.values(p.matches).includes(j)||p.result?.correct?'disabled':''}>${escapeHTML(t.pairs[j].right)} ${Object.values(p.matches).includes(j)?'✔':''}</button>`).join('');return `<div class="callout">Выберите карточку слева, затем пару справа. Соответствия можно составить без перетаскивания, в том числе на телефоне.</div><div class="pair-grid"><div class="pair-col">${left}</div><div class="pair-col">${right}</div></div><button class="btn btn-outline btn-small" style="margin-top:12px" data-action="reset-match" ${p.result?.correct?'disabled':''}>↺ Сбросить пары</button>`}
function playSort(t,p){const remaining=t.cards.map((x,i)=>p.assignments[i]===undefined?`<button class="sort-chip ${p.sortSelected===i?'active':''}" data-action="sort-choose" data-index="${i}" draggable="true">${escapeHTML(x.text)}</button>`:'').join('');const zones=t.categories.map((category,i)=>`<div class="sort-zone" role="button" tabindex="0" data-action="sort-assign" data-index="${i}" aria-label="Добавить элемент в категорию ${escapeHTML(category)}"><strong>${escapeHTML(category)}</strong>${t.cards.map((x,j)=>p.assignments[j]===i?`<button type="button" class="sort-chip assigned" title="Вернуть элемент" data-action="sort-unassign" data-index="${j}">${escapeHTML(x.text)} ×</button>`:'').join('')}</div>`).join('');return `<div class="callout">Нажмите на элемент, а затем на нужную группу. На компьютере элементы также можно перетаскивать мышью.</div><div class="sort-source">${remaining||'<span class="muted" style="font-size:12px">Все элементы распределены ✓</span>'}</div><div class="sort-zones">${zones}</div>`}
function playOrder(t,p){return `<div class="callout">Перемещайте шаги стрелками вверх и вниз. Такой способ удобен и на телефоне.</div><div class="order-list">${p.order.map((j,i)=>`<div class="order-row"><span class="order-number">${i+1}</span><span class="order-text">${escapeHTML(t.order[j])}</span><button class="order-move" data-action="order-up" data-index="${i}" aria-label="Поднять пункт ${i+1}" ${i===0||p.result?.correct?'disabled':''}>↑</button><button class="order-move" data-action="order-down" data-index="${i}" aria-label="Опустить пункт ${i+1}" ${i===p.order.length-1||p.result?.correct?'disabled':''}>↓</button></div>`).join('')}</div>`}
function playInput(t,p){return `<label class="field-label" for="answer-field">Ваш ответ</label><input id="answer-field" class="field answer-field" inputmode="text" autocomplete="off" placeholder="Например: −1/4" value="${escapeHTML(p.inputValue||'')}" ${p.result?.correct?'disabled':''}><div class="keyboard-tip">Используйте знак / для дробей. Например, 1/2 и 0,5 считаются равными.</div>`}

function seedSnakeFoods(p,t){if(t.type!=='arcade'||p.stage>=t.items.length)return;const pos=[2,8,22,26,10,19,4,23,7,27,1,28];const available=pos.filter(n=>!p.snake.includes(n));p.foods=shuffle(available).slice(0,3);p.foodOrder=shuffle([0,1,2]);}
function arcadeCurrent(t,p){return t.items[Math.min(p.stage,t.items.length-1)]}
function completeArcade(t,p){p.result={correct:true};p.earned=p.attempts===0?10:p.attempts<=2?7:4;p.feedback=t.explanation||'Все уровни пройдены!';}
function markArcadeSuccess(t,p){p.stage++;p.feedback='✅ Верно! Следующее испытание.';if(p.stage>=t.items.length){completeArcade(t,p)}else{p.stageChoices=shuffle([0,1,2]);if(p.game==='snake')seedSnakeFoods(p,t);if(p.game==='tower')p.pile=Math.max(0,p.pile-1);}}
function arcadeAnswer(t,p,value){if(p.result?.correct||p.failed)return;if(answerEqual(value,arcadeCurrent(t,p).answer)){if(p.game==='domino')p.chain.push(p.stage);markArcadeSuccess(t,p)}else{p.attempts++;p.feedback=p.game==='tower'?'Неверный блок остаётся в башне. Попробуй другой.':p.game==='climb'?'Ой, неверная ступенька! Попробуй снова.':'Это ловушка! Ищи верный ответ.';if(p.game==='tower'){p.pile=Math.min(p.pile+1,4);if(p.pile===4){p.failed=true;p.feedback='Башня заполнена. Начни заново и попробуй не допускать ошибок.'}}if(p.game==='climb'&&p.stage>0){p.stage--;p.stageChoices=shuffle([0,1,2]);p.feedback='Неверный ответ: ты спустился на одну ступень. Вернись на прежнюю высоту!'}}render();}
function snakeStep(t,p,delta){if(p.result?.correct||p.failed)return;const head=p.snake[0],row=Math.floor(head/6),col=head%6;const nr=row+(delta===-6?-1:delta===6?1:0),nc=col+(delta===-1?-1:delta===1?1:0);if(nr<0||nr>5||nc<0||nc>5){p.feedback='Не выходи за границы поля.';render();return}const next=nr*6+nc;const foodIndex=p.foods.indexOf(next);const grows=foodIndex>=0&&p.foodOrder[foodIndex]===0;const bodyToCheck=grows?p.snake:p.snake.slice(0,-1);if(bodyToCheck.includes(next)){p.feedback='Змейка не должна сталкиваться сама с собой. Попробуй другой путь.';render();return}p.snake.unshift(next);if(!grows)p.snake.pop();if(foodIndex>=0){const item=arcadeCurrent(t,p);const picked=[item.answer,...item.wrong][p.foodOrder[foodIndex]];arcadeAnswer(t,p,picked);return}render()}
function playArcade(t,p){let item=arcadeCurrent(t,p);if(!ARCADE_MODES[p.game])p.game='domino';let bar=`<div class="arcade-top"><strong>${ARCADE_MODES[p.game].icon} ${ARCADE_MODES[p.game].label}</strong><span>Уровень ${Math.min(p.stage+1,t.items.length)} / ${t.items.length} · Ошибок: ${p.attempts}</span></div><div class="arcade-progress"><div style="width:${Math.round(p.stage/t.items.length*100)}%"></div></div>`;if(p.failed)return bar+`<div class="arcade-win fail">🧱<h3>Башня заполнена!</h3><p>Попробуй пройти уровни ещё раз.</p></div>`;if(p.result?.correct)return bar+`<div class="arcade-win">🏆<h3>Ты победил!</h3><p>Пройдено ${t.items.length} задач.</p></div>`;
 if(p.game==='domino'){let tiles=p.tileOrder.filter(i=>!p.chain.includes(i)).map(i=>`<button class="domino-tile" data-action="domino-pick" data-index="${i}"><span>${escapeHTML(t.items[i].answer)}</span><span>${escapeHTML(i===t.items.length-1?'🏁':t.items[i+1].prompt)}</span></button>`).join('');return bar+`<div class="callout">Слева — ожидаемый ответ, справа — новый вопрос. Найди костяшку с ответом на текущее выражение. После выбора цепь продолжится.</div><div class="domino-chain"><div class="domino-seed">${escapeHTML(t.items[0].prompt)}</div>${p.chain.map(i=>`<div class="domino-tile placed"><span>${escapeHTML(t.items[i].answer)}</span><span>${escapeHTML(i===t.items.length-1?'🏁':t.items[i+1].prompt)}</span></div>`).join('')}</div><p class="game-instruction">Ищи ответ на: <strong>${escapeHTML(item.prompt)}</strong></p><div class="domino-tiles">${tiles}</div>`}
 if(p.game==='tower'){const options=p.stageChoices.map(i=>[item.answer,...item.wrong][i]);return bar+`<div class="callout">Верный блок исчезает. Неверные накапливаются снизу. После четырёх накопленных ошибок игра закончится. Правильный ответ снимает один блок башни.</div><p class="game-instruction">Вычисли: <strong>${escapeHTML(item.prompt)}</strong></p><div class="tower-stage"><div class="tower-choices">${options.map((opt,i)=>`<button class="falling-block" data-action="arcade-answer" data-value="${escapeHTML(opt)}" style="--delay:${i}">${escapeHTML(opt)}</button>`).join('')}</div><div class="tower-floor">${Array.from({length:p.pile},(_,i)=>`<span class="tower-brick">⚠️</span>`).join('')}<div>Накоплено блоков: ${p.pile} / 4</div></div></div>`}
 if(p.game==='climb'){let height=p.stage;const steps=Array.from({length:t.items.length},(_,i)=>`<div class="climb-step ${i<p.stage?'done':''}" style="margin-left:${i*minClimbIndent(t.items.length)}px"><span>${i===p.stage?'🧗':i<p.stage?'✓':'⛰️'}</span> ${i<p.stage?'Пройдено':'Высота '+(i+1)}</div>`).join('');return bar+`<div class="climb-scene"><div class="climb-route">${steps}<div class="climb-peak">🏔️ ВЕРШИНА</div></div><div class="climb-challenge"><p class="game-instruction">Шаг ${p.stage+1}: <strong>${escapeHTML(item.prompt)}</strong></p>${p.stageChoices.map(i=>[item.answer,...item.wrong][i]).map((z,i)=>`<button class="climb-choice" data-action="arcade-answer" data-value="${escapeHTML(z)}">🪨 ${escapeHTML(z)}</button>`).join('')}</div></div>`}
 // snake: answers occupy three cells, turn-based controls for touchscreen and keyboard
 const labels=[item.answer,...item.wrong];const board=Array.from({length:36},(_,i)=>{let food=p.foods.indexOf(i);let body=p.snake.indexOf(i);const val=food<0?'':labels[p.foodOrder[food]];return `<div class="snake-cell ${body===0?'head':body>0?'body':food>=0?'food':''}" title="${food>=0?escapeHTML(val):''}">${body===0?'🐍':body>0?'●':food>=0?escapeHTML(val):''}</div>`}).join('');return bar+`<div class="callout">Пошаговая змейка: используй стрелки клавиатуры или кнопки. Подведи голову к правильному ответу, избегая своего хвоста.</div><p class="game-instruction">Вычисли: <strong>${escapeHTML(item.prompt)}</strong></p><div class="snake-grid" role="img" aria-label="Игровое поле 6 на 6. Змейка управляется стрелками, ответы расположены на поле">${board}</div><div class="snake-controls"><button aria-label="Вверх" data-action="snake-step" data-delta="-6">↑</button><div><button aria-label="Влево" data-action="snake-step" data-delta="-1">←</button><button aria-label="Вниз" data-action="snake-step" data-delta="6">↓</button><button aria-label="Вправо" data-action="snake-step" data-delta="1">→</button></div></div>`;
}
function minClimbIndent(n){return Math.min(18,Math.floor(135/Math.max(1,n)))}
function playContent(t,p){if(t.type==='quiz')return playQuiz(t,p);if(t.type==='match')return playMatch(t,p);if(t.type==='sort')return playSort(t,p);if(t.type==='order')return playOrder(t,p);if(t.type==='input')return playInput(t,p);if(t.type==='arcade')return playArcade(t,p);return '<p>Неизвестный тип.</p>'}
function displayFeedback(p){if(!p.feedback)return '';return `<div role="status" class="feedback ${p.result?.correct?'success':''}"><strong>${p.result?.correct?'✅ Правильно!':'💡 Можно попробовать ещё раз'}</strong>${escapeHTML(p.feedback)}${p.result?.correct&&p.earned?`<div style="font-weight:900;margin-top:5px">+${p.earned} очков</div>`:''}</div>`}
function questProgress(qr){const q=getQuest(qr.id);if(!q)return '';return `<div class="quest-route" aria-label="Прогресс квеста">${q.taskIds.map((tid,i)=>`${i?`<span class="quest-link ${i<=qr.idx?'completed':''}"></span>`:''}<span class="quest-node ${i<qr.idx?'completed':i===qr.idx?'current':''}" title="Этап ${i+1}">${i<qr.idx?'✓':i===qr.idx?'⚡':'🔒'}</span>`).join('')}</div>`}
function showPlay(){const p=state.play,t=p&&getTask(p.id);if(!t)return `<div class="empty"><h3>Нет активной игры</h3><button class="btn btn-primary" data-action="nav" data-tab="library">Выбрать задание</button></div>`;const qr=p.context==='quest'?state.questRun:null;const q=qr&&getQuest(qr.id);let action='';if(p.result?.correct){action=qr?`<button class="btn btn-primary" data-action="quest-next">${qr.idx===(q?.taskIds.length||0)-1?'Завершить квест 🏆':'Следующее испытание →'}</button>`:`<button class="btn btn-primary" data-action="replay">↻ Сыграть ещё раз</button>`}else action=t.type==='arcade'?`<button class="btn btn-outline" data-action="replay">↻ Начать заново</button>`:`<button class="btn btn-primary" data-action="check">Проверить ответ ✓</button>`;return `<div class="play-shell"><div class="play-heading">${qr?`<div class="tag amber" style="display:inline-block">🗺️ ${escapeHTML(q?.title)}</div>${questProgress(qr)}`:'<span class="tag">🎮 Игровой режим</span>'}<h2>${escapeHTML(t.title)}</h2><p>${escapeHTML(typeName(t.type))} · ${escapeHTML(t.topic)} · ${escapeHTML(t.grade)} класс · Попыток: ${p.attempts} ${qr?'· Баллы квеста: '+qr.score:''}</p></div><div class="play-card"><div class="question-label">${qr?'ЭТАП '+(qr.idx+1)+' ИЗ '+q.taskIds.length:'ИНТЕРАКТИВНОЕ ЗАДАНИЕ'}</div><div class="question">${escapeHTML(t.question)}</div>${t.type==='arcade'?`<div class="mode-selector game-change">${Object.entries(ARCADE_MODES).map(([mode,m])=>`<button type="button" class="mode-tile ${p.game===mode?'selected':''}" data-action="arcade-change" data-mode="${mode}" aria-pressed="${p.game===mode}">${m.icon} ${m.label}</button>`).join('')}</div>`:''}${playContent(t,p)}${displayFeedback(p)}<div class="controls-row"><button class="btn btn-outline" data-action="${qr?'quest-exit':'nav'}" data-tab="library">← ${qr?'Все квесты':'Библиотека'}</button>${action}</div></div><div class="play-footer">Проверка выполняется в вашем браузере · Без внешних сервисов</div></div>`}
function checkPlay(){const p=state.play,t=p&&getTask(p.id);if(!t||p.result?.correct||t.type==='arcade')return;let correct=false,diagnostic='';if(t.type==='quiz'){if(p.chosen===null){toast('Сначала выберите ответ.');return}correct=Boolean(t.options[p.chosen]?.correct);diagnostic='Проверь условие и не торопись с выбором.'}else if(t.type==='match'){if(Object.keys(p.matches).length!==t.pairs.length){toast('Сначала соедините все пары.');return}correct=Object.keys(p.matches).every(i=>Number(i)===p.matches[i]);diagnostic='Проверь, какие значения соответствуют друг другу.'}else if(t.type==='sort'){if(Object.keys(p.assignments).length!==t.cards.length){toast('Распределите все элементы по категориям.');return}correct=t.cards.every((card,j)=>t.categories[p.assignments[j]]===card.category);diagnostic='Один или несколько элементов находятся не в своей группе.'}else if(t.type==='order'){correct=p.order.every((k,i)=>k===i);diagnostic='Проверь логический порядок выполнения шагов.'}else if(t.type==='input'){p.inputValue=String(document.getElementById('answer-field')?.value||'').trim();if(!p.inputValue){toast('Введите ответ.');return}({correct,diagnostic}=evaluateInput(p.inputValue,t.answer))}
p.attempts+=1;if(correct){p.earned=p.attempts===1?10:p.attempts===2?7:4;p.result={correct:true};p.feedback=t.explanation||'Все верно. Отличная работа!'}else{p.feedback=(p.attempts>1?t.hint||diagnostic:diagnostic)+(p.attempts===1&&t.hint?' Подсказка доступна при повторной ошибке.':'');p.result=null}render();}
function quests(){return `<div class="section-head" style="margin-top:0"><div><h1 class="h1">Мир <span class="gradient-text">квестов</span></h1><p>Собирайте приключения из уже подготовленных заданий</p></div><button class="btn btn-primary" data-action="new-quest">＋ Создать квест</button></div><div class="quest-list">${state.quests.map(q=>`<article class="quest-card"><div class="quest-banner"><h3>${escapeHTML(q.title)}</h3><div class="quest-emoji">${escapeHTML(q.theme||'🗺️')}</div></div><div class="quest-info"><span class="tag amber">${q.taskIds.length} испытаний</span><p>${escapeHTML(q.description||'Авторское интерактивное приключение')}</p><div class="toolbar"><button class="btn btn-primary btn-small" data-action="quest-start" data-id="${escapeHTML(q.id)}">▶ Начать</button><button class="btn btn-outline btn-small" data-action="edit-quest" data-id="${escapeHTML(q.id)}">✎ Изменить</button><button class="btn btn-outline btn-small" data-action="delete-quest" data-id="${escapeHTML(q.id)}">✕</button></div></div></article>`).join('')}${!state.quests.length?`<div class="empty"><div class="big">🗺️</div><h3>Здесь будут ваши квесты</h3><button class="btn btn-primary" data-action="new-quest">Создать квест</button></div>`:''}</div><div class="notice">Это первая механика квестов: последовательное открытие испытаний. Нелинейные маршруты, выбор ответвлений, предметы и редактирование игровых сцен будут добавляться в следующем этапе.</div>`}
function newQuestDraft(){return {id:null,title:'',description:'',theme:'🗺️',taskIds:[]}}
function questBuilder(){const d=state.questDraft||(state.questDraft=newQuestDraft());const chosen=d.taskIds.map((tid,i)=>{const t=getTask(tid);return t?`<div class="order-row"><span class="order-number">${i+1}</span><span class="order-text">${escapeHTML(t.title)}</span><button class="order-move" data-action="quest-up" data-index="${i}" aria-label="Переместить этап вверх" ${i===0?'disabled':''}>↑</button><button class="order-move" data-action="quest-down" data-index="${i}" aria-label="Переместить этап вниз" ${i===d.taskIds.length-1?'disabled':''}>↓</button></div>`:''}).join('');return `<div class="section-head" style="margin-top:0"><div><h1 class="h1">Конструктор <span class="gradient-text">квестов</span></h1><p>Составьте маршрут испытаний из библиотеки заданий</p></div><button class="btn btn-outline" data-action="nav" data-tab="quests">← Все квесты</button></div><div class="builder-grid"><section class="panel"><form id="quest-form"><div class="form-group"><label class="field-label">Название приключения</label><input class="field" name="title" value="${escapeHTML(d.title)}" placeholder="Например: Загадка древней пирамиды"></div><div class="form-group"><label class="field-label">Короткое описание</label>${textArea('description',d.description,'Какую загадку предстоит разгадать?',3)}</div><div class="form-group"><label class="field-label">Символ приключения</label><select class="field" name="theme">${['🗺️','🚀','🏺','🏴‍☠️','🔎','🧪','🏰','⚽','🌊'].map(x=>`<option ${d.theme===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="divider"></div><h2>Выберите испытания</h2><div class="callout">Отметьте минимум два задания. Они будут открываться ученику по очереди. Порядок настраивается стрелками ниже.</div>${state.tasks.length?state.tasks.map(t=>`<label class="check-row"><input type="checkbox" data-action="quest-toggle" data-id="${escapeHTML(t.id)}" ${d.taskIds.includes(t.id)?'checked':''}><span>${tIcon(t.type)} ${escapeHTML(t.title)} <span class="muted">(${escapeHTML(t.grade)} кл.)</span></span></label>`).join(''):`<div class="empty">Сначала создайте задания в библиотеке</div>`}<div class="divider"></div><h2>Маршрут · ${d.taskIds.length} этапов</h2>${chosen||'<p class="muted" style="font-size:12px">Пока нет выбранных испытаний.</p>'}${state.err?`<div class="validation-error">${escapeHTML(state.err)}</div>`:''}<div class="form-actions"><button type="submit" class="btn btn-primary">✓ Сохранить квест</button><button type="button" data-action="nav" data-tab="quests" class="btn btn-outline">Отмена</button></div></form></section><aside class="panel"><h2>🧭 Как работает квест?</h2><div class="callout">Ученик проходит задания по порядку. После правильного ответа следующий этап разблокируется.</div><div class="callout">Каждая правильная попытка приносит 10, 7 или 4 очка в зависимости от количества попыток.</div><p class="helper">Созданный квест можно редактировать. Сами задания остаются в общей библиотеке, поэтому одно упражнение можно использовать в нескольких приключениях.</p><div class="notice">Первая версия поддерживает линейный маршрут. Для изменения сюжета по условиям и инвентаря потребуется отдельный редактор сцен.</div></aside></div>`}
function saveQuest(){const d=state.questDraft;if(!d)return;const form=document.getElementById('quest-form');if(form){d.title=form.querySelector('[name=title]').value.trim();d.description=form.querySelector('[name=description]').value.trim();d.theme=form.querySelector('[name=theme]').value}if(!d.title||d.taskIds.length<2){state.err='Напишите название квеста и выберите минимум два задания.';render();return}if(!d.id)d.id=id();let at=state.quests.findIndex(x=>x.id===d.id);if(at<0)state.quests.unshift(d);else state.quests[at]=d;state.questDraft=null;state.err='';persist();state.tab='quests';render();toast('Квест сохранён!')}
function startQuest(questId){const q=getQuest(questId);if(!q||q.taskIds.length<2||q.taskIds.some(x=>!getTask(x))){toast('В квесте не хватает заданий. Откройте его редактор.');return}state.questRun={id:questId,idx:0,score:0,completed:false};startPlay(q.taskIds[0],'quest')}
function nextQuest(){const qr=state.questRun,p=state.play,q=qr&&getQuest(qr.id);if(!qr||!q||!p?.result?.correct)return;qr.score+=p.earned;qr.idx+=1;if(qr.idx>=q.taskIds.length){qr.completed=true;state.tab='quest-finale';state.play=null;render();return}startPlay(q.taskIds[qr.idx],'quest')}
function questFinale(){const qr=state.questRun,q=qr&&getQuest(qr.id);if(!qr?.completed||!q)return quests();let maximum=q.taskIds.length*10;return `<div class="quest-finale"><div class="emoji">🏆</div><h2>Квест пройден!</h2><p>«${escapeHTML(q.title)}»<br>Все испытания завершены, а математический портал открыт!</p><h1 class="h1 gradient-text">${qr.score} / ${maximum}</h1><p>очков за ${q.taskIds.length} испытаний</p><div class="toolbar" style="justify-content:center"><button class="btn btn-primary" data-action="quest-start" data-id="${escapeHTML(q.id)}">↻ Пройти ещё раз</button><button class="btn btn-outline" data-action="nav" data-tab="quests">Все квесты</button></div></div>`}
function render(){const x=state.tab;app.innerHTML=layout(x==='student'?studentStudio():x==='home'?showHome():x==='library'?library():x==='builder'?editor():x==='play'?showPlay():x==='quests'?quests():x==='quest-builder'?questBuilder():x==='quest-finale'?questFinale():showHome())}
function downloadJSON(){const documentData={schemaVersion:1,product:'Интерактивная мастерская',exportedAt:new Date().toISOString(),tasks:state.tasks,quests:state.quests};const blob=new Blob([JSON.stringify(documentData,null,2)],{type:'application/json;charset=utf-8'});const uri=URL.createObjectURL(blob);const link=document.createElement('a');link.href=uri;link.download='interactive_workshop_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(uri),1000);toast('JSON экспортирован. Файл можно сохранить как резервную копию.')}
function replaceData(payload){if(!payload||payload.schemaVersion!==1||!Array.isArray(payload.tasks)||!Array.isArray(payload.quests))throw new Error('Ожидается JSON-файл из Мастерской с версией данных 1 (поддерживается 0.1/0.2).');if(payload.tasks.length>2000||payload.quests.length>300)throw new Error('Слишком много объектов в файле.');const ids=new Set();for(const t of payload.tasks){if(!t||typeof t!=='object'||typeof t.id!=='string'||t.id.length>160||ids.has(t.id))throw new Error('Некорректные или повторяющиеся ID заданий.');ids.add(t.id);const props={quiz:'options',match:'pairs',sort:'cards',order:'order',input:'answer',arcade:'items'};if(typeof t.title!=='string'||typeof t.question!=='string'||(t.type!=='input'&&!Array.isArray(t[props[t.type]])))throw new Error('Ошибочный формат задания.');if(validateTask(t))throw new Error('В импортируемом файле есть неполное задание: '+t.title)}for(const q of payload.quests){if(!q||typeof q.id!=='string'||!Array.isArray(q.taskIds)||q.taskIds.some(x=>!ids.has(x))||typeof q.title!=='string')throw new Error('Некорректный квест или ссылка на отсутствующее задание.')}if(!window.confirm('Заменить текущую библиотеку данными из файла? Перед импортом рекомендуем экспортировать резервную копию.'))return;state.tasks=payload.tasks;state.quests=payload.quests;state.draft=null;state.questDraft=null;state.play=null;state.questRun=null;state.tab='library';state.search='';state.filter='all';persist();render();toast('Библиотека и квесты успешно импортированы.')}
app.addEventListener('click',event=>{
 const a=event.target.closest('[data-action]');if(!a)return;if(a.tagName==='A')event.preventDefault();const act=a.dataset.action,tId=a.dataset.id,idx=Number(a.dataset.index);
 if(act==='nav'){state.tab=a.dataset.tab||'home';state.err='';if(state.tab==='builder'&&!state.draft)state.draft=newDraft();if(state.tab==='quest-builder'&&!state.questDraft)state.questDraft=newQuestDraft();render();return}
 if(act==='new'){state.draft=newDraft(a.dataset.type||'quiz');state.err='';state.tab='builder';render();return}
 if(act==='edit'){const t=getTask(tId);if(!t)return;state.draft=deepCopy(t);state.err='';state.tab='builder';render();return}
 if(act==='clone'){const t=getTask(tId);if(!t)return;const copy=deepCopy(t);copy.id=id();copy.title=t.title+' (копия)';state.tasks.unshift(copy);persist();render();toast('Копия задания создана.');return}
 if(act==='delete'){const t=getTask(tId);if(!t)return;const n=state.quests.filter(q=>q.taskIds.includes(tId)).length;if(!window.confirm(`Удалить задание «${t.title}»?${n?' Оно используется в '+n+' квестах, ссылки на него также будут удалены.':''}`))return;state.tasks=state.tasks.filter(x=>x.id!==tId);state.quests=state.quests.map(q=>({...q,taskIds:q.taskIds.filter(x=>x!==tId)}));persist();render();toast('Задание удалено.');return}
 if(act==='play'){state.questRun=null;startPlay(tId);return}
 if(act==='arcade-mode'){state.questRun=null;startPlay(tId,'direct',a.dataset.mode);return}
 if(act==='arcade-change'){const p=state.play;if(p&&getTask(p.id)?.type==='arcade'){startPlay(p.id,p.context,a.dataset.mode)}return}
 if(act==='domino-pick'){const p=state.play,t=p&&getTask(p.id);if(!p||!t||p.result?.correct||p.game!=='domino')return;const chosen=t.items[idx];if(!chosen)return;arcadeAnswer(t,p,chosen.answer);return}
 if(act==='arcade-answer'){const p=state.play,t=p&&getTask(p.id);if(t?.type==='arcade')arcadeAnswer(t,p,a.dataset.value);return}
 if(act==='snake-step'){const p=state.play,t=p&&getTask(p.id);if(t?.type==='arcade'&&p.game==='snake')snakeStep(t,p,Number(a.dataset.delta));return}
 if(act==='student-mode'){if(state.studentDraft){state.studentDraft.game=a.dataset.mode;render()}return}
 if(act==='student-add'){if(state.studentDraft&&state.studentDraft.items.length<30){state.studentDraft.items.push({prompt:'',answer:'',wrong:['','']});state.err='';render()}return}
 if(act==='student-remove'){if(state.studentDraft&&state.studentDraft.items.length>2){state.studentDraft.items.splice(idx,1);state.err='';render()}return}
 if(act==='student-example'){state.studentDraft={title:'Моя игра: математический вызов',grade:'5',topic:'Действия с числами',game:'snake',items:[{prompt:'6 + 7',answer:'13',wrong:['12','14']},{prompt:'5 × 4',answer:'20',wrong:['15','25']},{prompt:'18 : 3',answer:'6',wrong:['3','9']}],hint:'Проверь порядок действий.'};state.err='';render();return}
 if(act==='add-arcade-samples'){let added=0;for(const sample of arcadeSamples){if(!getTask(sample.id)){state.tasks.push(deepCopy(sample));added++}}persist();render();toast(added?'Примеры добавлены: '+added:'Все примеры уже в библиотеке.');return}
 if(act==='choose'){if(!state.play?.result?.correct){state.play.chosen=idx;state.play.feedback=null;render()}return}
 if(act==='match-left'){const p=state.play;if(p&&!p.result?.correct){p.selectedLeft=idx;render()}return}
 if(act==='match-right'){const p=state.play;if(p&&p.selectedLeft!==null&&p.matches[p.selectedLeft]===undefined&&!Object.values(p.matches).includes(idx)){p.matches[p.selectedLeft]=idx;p.selectedLeft=null;p.feedback=null;render()}else if(p&&p.selectedLeft===null)toast('Сначала выберите карточку слева.');return}
 if(act==='reset-match'){if(state.play){state.play.matches={};state.play.selectedLeft=null;state.play.feedback=null;render()}return}
 if(act==='sort-choose'){if(state.play){state.play.sortSelected=idx;state.play.feedback=null;render()}return}
 if(act==='sort-assign'){const p=state.play;if(!p||p.result?.correct)return;if(p.sortSelected===null){toast('Сначала выберите элемент сверху.');return}p.assignments[p.sortSelected]=idx;p.sortSelected=null;p.feedback=null;render();return}
 if(act==='sort-unassign'){if(state.play&&!state.play.result?.correct){delete state.play.assignments[idx];state.play.feedback=null;render()}return}
 if(act==='order-up'||act==='order-down'){const p=state.play;if(!p||p.result?.correct)return;const next=idx+(act==='order-up'?-1:1);if(next<0||next>=p.order.length)return;[p.order[next],p.order[idx]]=[p.order[idx],p.order[next]];p.feedback=null;render();return}
 if(act==='check'){checkPlay();return}
 if(act==='replay'){if(state.play)startPlay(state.play.id,state.play.context,state.play.game);return}
 if(act==='export'){downloadJSON();return}
 if(act==='import'){const el=document.getElementById('import-file');if(el)el.click();return}
 if(act==='new-quest'){state.questDraft=newQuestDraft();state.tab='quest-builder';state.err='';render();return}
 if(act==='edit-quest'){const q=getQuest(tId);if(q){state.questDraft=deepCopy(q);state.tab='quest-builder';state.err='';render()}return}
 if(act==='quest-start'){startQuest(tId);return}
 if(act==='quest-next'){nextQuest();return}
 if(act==='quest-exit'){state.tab='quests';state.play=null;render();return}
 if(act==='quest-up'||act==='quest-down'){const d=state.questDraft;if(!d)return;const next=idx+(act==='quest-up'?-1:1);if(next<0||next>=d.taskIds.length)return;[d.taskIds[idx],d.taskIds[next]]=[d.taskIds[next],d.taskIds[idx]];render();return}
 if(act==='delete-quest'){const q=getQuest(tId);if(q&&window.confirm('Удалить квест «'+q.title+'»? Задания в библиотеке сохранятся.')){state.quests=state.quests.filter(x=>x.id!==tId);persist();render();toast('Квест удалён.')}return}
});
app.addEventListener('submit',event=>{if(event.target.id==='task-form'){event.preventDefault();saveTask()}else if(event.target.id==='student-form'){event.preventDefault();saveStudent()}else if(event.target.id==='quest-form'){event.preventDefault();saveQuest()}});
app.addEventListener('input',event=>{const el=event.target;if(el.dataset.studentField&&state.studentDraft){state.studentDraft[el.dataset.studentField]=el.value}if(el.dataset.studentIndex!==undefined&&state.studentDraft){const item=state.studentDraft.items[Number(el.dataset.studentIndex)];if(item){const key=el.dataset.studentKey;if(key==='wrong0'||key==='wrong1')item.wrong[Number(key.slice(-1))]=el.value;else if(key==='prompt'||key==='answer')item[key]=el.value}}if(el.id==='search-tasks'){state.search=el.value;const results=state.tasks.filter(t=>(state.filter==='all'||t.type===state.filter)&&[t.title,t.topic,t.question,t.grade].join(' ').toLowerCase().includes(state.search.toLowerCase()));const target=document.getElementById('task-results');if(target)target.innerHTML=results.length?results.map(renderTaskCard).join(''):'<div class="empty"><h3>Задания не найдены</h3><p>Измените запрос.</p></div>'}if(el.id==='answer-field'&&state.play)state.play.inputValue=el.value;if(state.tab==='quest-builder'&&state.questDraft&&['title','description','theme'].includes(el.name))state.questDraft[el.name]=el.value});
app.addEventListener('change',event=>{const el=event.target;
 if(el.id==='filter-tasks'){state.filter=el.value;render();return}if(el.dataset.studentField&&state.studentDraft){state.studentDraft[el.dataset.studentField]=el.value;return}
 if(el.id==='editor-type'){state.draft=parseDraftFromForm();state.draft.type=el.value;state.err='';render();return}
 if(el.dataset.action==='quest-toggle'){if(!state.questDraft)return;const tid=el.dataset.id,arr=state.questDraft.taskIds;if(el.checked&&!arr.includes(tid))arr.push(tid);if(!el.checked)state.questDraft.taskIds=arr.filter(x=>x!==tid);state.err='';render();return}
 if(el.id==='import-file'){const file=el.files?.[0];if(!file)return;if(file.size>5_000_000){toast('Слишком большой файл JSON.');return}const reader=new FileReader();reader.onload=()=>{try{replaceData(JSON.parse(reader.result))}catch(err){toast('Ошибка импорта: '+err.message)}};reader.onerror=()=>toast('Не удалось прочитать файл.');reader.readAsText(file,'UTF-8')}
});
app.addEventListener('keydown',e=>{if(state.tab==='play'&&state.play?.game==='snake'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const delta={ArrowUp:-6,ArrowDown:6,ArrowLeft:-1,ArrowRight:1}[e.key];const t=getTask(state.play.id);if(t?.type==='arcade')snakeStep(t,state.play,delta);return}const el=e.target.closest('.sort-zone');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click()}});
app.addEventListener('dragstart',e=>{const chip=e.target.closest('.sort-chip[data-action="sort-choose"]');if(chip&&e.dataTransfer){e.dataTransfer.setData('text/plain',chip.dataset.index);e.dataTransfer.effectAllowed='move'}});
app.addEventListener('dragover',e=>{if(e.target.closest('.sort-zone'))e.preventDefault()});
app.addEventListener('drop',e=>{const zone=e.target.closest('.sort-zone'),p=state.play;if(!zone||!p||p.result?.correct)return;e.preventDefault();const j=Number(e.dataTransfer?.getData('text/plain'));if(!Number.isInteger(j)||j<0||j>=getTask(p.id).cards.length)return;p.assignments[j]=Number(zone.dataset.index);p.sortSelected=null;p.feedback=null;render()});
render();
})();

</script>
