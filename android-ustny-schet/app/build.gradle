plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.ligaznaniy.ustnychet'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.ligaznaniy.ustnychet'
        minSdk 24
        targetSdk 34
        versionCode 64
        versionName '6.4'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
