<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лига знаний — Китайский — Итоговый тест урока 3</title><style>body{margin:0;background:linear-gradient(120deg,#061b3d,#0d427e);font:17px system-ui;color:white}header{background:#aa2536;padding:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{max-width:850px;margin:24px auto;padding:18px}h1{color:#ffda68}section{background:#f5faff;color:#15355d;padding:24px;border-radius:20px}.question{border-bottom:1px solid #c4d9ed;padding:16px 0}button{background:#ffd05c;border:0;border-radius:12px;padding:12px;margin:5px;cursor:pointer;font-weight:800}.question button{min-width:110px}.question button[disabled]{opacity:.8;cursor:default}.ok{color:green;font-weight:800}.bad{color:#b12222;font-weight:800}a{color:#ffdf81}#result{font-size:22px;font-weight:900}button:focus-visible{outline:3px solid #2779e8}</style><!-- Chinese course unified background v1 --><style>

</style></head><body><header><a href="lesson-03.html">← К тренировке</a><strong>⚽ Лига знаний · Китайский</strong><span>⚽ <b id="goals">0</b>/8</span></header><main><h1>🏆 Итоговый тест · Урок 3</h1><p>Егор, проверь, как ты научился разбирать китайские слоги! Ответь на 10 вопросов. Первые 8 приносят до 8 голов, последние 2 — дополнительные.</p><section><div id="quizQuestions"></div><p id="result" aria-live="polite"></p><button id="restart" type="button">Пройти заново</button></section><p><a href="lesson-03.html">← Вернуться к практике</a>　<a href="index.html">Завершить · к темам →</a></p></main><script>const qs=[["Что такое пиньинь?",["Запись произношения","Иероглиф","Число"],0],["Инициаль в ma?",["a","m","ma"],1],["Финаль в ma?",["m","a","ma"],1],["Какая буква — финаль?",["b","p","ü"],2],["m + a = ?",["am","ma","mi"],1],["Какая буква — инициаль?",["f","o","e"],0],["Зачем нужны тоны?",["Для красоты","Для различения произношения и значения","Для пробелов"],1],["Какой слог начинается с b?",["ba","ma","pa"],0],["Какая пара образует слог po?",["p + o","b + a","f + a"],0],["Какая финаль в слоге fu?",["f","u","fu"],1]];
const key="liga-cn-lesson3";let answers={};try{answers=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){};function render(){const root=document.getElementById("quizQuestions");root.replaceChildren();qs.forEach((q,i)=>{const d=document.createElement("div");d.className="question";const label=document.createElement("p");label.textContent=(i+1)+". "+q[0];d.append(label);q[1].forEach((v,j)=>{const b=document.createElement("button");b.type="button";b.textContent=v;b.disabled=Object.prototype.hasOwnProperty.call(answers,i);b.onclick=()=>{answers[i]=j;try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}render();window.dispatchEvent(new Event("storage"))};d.append(b)});if(Object.prototype.hasOwnProperty.call(answers,i)){const p=document.createElement("p");p.className=answers[i]===q[2]?"ok":"bad";p.textContent=answers[i]===q[2]?"Верно! "+(i<8?"⚽ Гол!":"Дополнительный ответ верный!"):"Правильный ответ: "+q[1][q[2]];d.append(p)}root.append(d)});const n=qs.slice(0,8).filter((q,i)=>answers[i]===q[2]).length;document.getElementById("goals").textContent=n;document.getElementById("result").textContent=Object.keys(answers).length===10?"Тест завершён! Голов: "+n+" / 8":""}document.getElementById("restart").onclick=()=>{answers={};try{localStorage.removeItem(key)}catch(e){}render()};render();</script><script src="../shared/js/global-stars-v818.js"></script></body></html>
