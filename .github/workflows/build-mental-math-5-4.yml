name: Build Android APK 5.4 - lessons and simple UI
on:
  push:
    branches: [android-mental-math-v5-4-learning-20261031]
    paths:
      - 'apk-build/v54-source.b64'
      - '.github/workflows/build-mental-math-5-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apk-build/v54-source.b64'
      - '.github/workflows/build-mental-math-5-4.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mental-math-v5-4-learning-20261031
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK on runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android project and v5.4 changes
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > app-base.zip
          unzip -q -o app-base.zip
          base64 --decode apk-build/v54-source.b64 > updates.zip
          unzip -q -o updates.zip -d LigaZnaniyAndroid
          test -s LigaZnaniyAndroid/app/src/main/assets/topics/lessons.js
          test -s LigaZnaniyAndroid/app/src/main/assets/stats.js
          test -s LigaZnaniyAndroid/app/src/main/assets/mathjax-svg.js
      - name: Install Android packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile installable APK
        run: |
          (cd LigaZnaniyAndroid && gradle --no-daemon :app:assembleDebug)
          test -s LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk
      - name: Save v5.4 APK to isolated branch
        run: |
          cp LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk apk-build/Liga_Znaniy_Ustny_Schet_5_4.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-build/Liga_Znaniy_Ustny_Schet_5_4.apk
          git commit -m "Publish Android mental math v5.4 installable APK"
          git push origin HEAD:android-mental-math-v5-4-learning-20261031
      - uses: actions/upload-artifact@v4
        with:
          name: Liga-Znaniy-Ustny-Schet-5-4-APK
          path: apk-build/Liga_Znaniy_Ustny_Schet_5_4.apk
          if-no-files-found: error
