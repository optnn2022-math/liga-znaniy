name: Build Android 5.4.1 PDF hotfix
on:
  push:
    branches: [android-mental-math-v5-4-1-pdf-fix-20261031]
    paths:
      - 'apk-build/pdf-hotfix.b64'
      - '.github/workflows/build-mental-math-5-4-1-pdf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apk-build/pdf-hotfix.b64'
      - '.github/workflows/build-mental-math-5-4-1-pdf.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mental-math-v5-4-1-pdf-fix-20261031
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore last approved source with PDF hotfix
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > base.zip
          unzip -q -o base.zip
          base64 --decode apk-build/v54-source.b64 > v54.zip
          unzip -q -o v54.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/pdf-hotfix.b64 > hotfix.zip
          unzip -q -o hotfix.zip -d LigaZnaniyAndroid
          test -s LigaZnaniyAndroid/app/src/main/assets/session-pdf.js
          if grep -Ei 'csv' LigaZnaniyAndroid/app/src/main/assets/general/index.html LigaZnaniyAndroid/app/src/main/assets/topics/app.js; then
            echo "Obsolete CSV reference in game sources"; exit 1
          fi
      - name: Android platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile
        run: |
          cd LigaZnaniyAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate and publish APK
        run: |
          install -Dm644 LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk apk-build/Liga_Znaniy_Ustny_Schet_5_4_1_PDF.apk
          unzip -l apk-build/Liga_Znaniy_Ustny_Schet_5_4_1_PDF.apk | grep 'assets/session-pdf.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk-build/Liga_Znaniy_Ustny_Schet_5_4_1_PDF.apk
          git commit -m 'Publish Android v5.4.1 PDF-only reports APK'
          git push origin HEAD:android-mental-math-v5-4-1-pdf-fix-20261031
      - uses: actions/upload-artifact@v4
        with:
          name: Liga-Znaniy-Ustny-Schet-5-4-1-PDF
          path: apk-build/Liga_Znaniy_Ustny_Schet_5_4_1_PDF.apk
          if-no-files-found: error
