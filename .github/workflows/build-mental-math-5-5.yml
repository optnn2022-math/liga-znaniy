name: Build mental math 5.5 Android and publish web
on:
  push:
    branches: [android-mental-math-v5-5-free-decomposition-20261031]
    paths:
      - 'apk-build/patch-v55.b64'
      - '.github/workflows/build-mental-math-5-5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apk-build/patch-v55.b64'
      - '.github/workflows/build-mental-math-5-5.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mental-math-v5-5-free-decomposition-20261031
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore all previous modules and add v5.5
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > original.zip
          unzip -q -o original.zip
          base64 --decode apk-build/v54-source.b64 > v54.zip
          unzip -q -o v54.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/pdf-hotfix.b64 > pdf.zip
          unzip -q -o pdf.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/patch-v55.b64 > v55.zip
          unzip -q -o v55.zip -d LigaZnaniyAndroid
          test -s LigaZnaniyAndroid/app/src/main/assets/topics/lessons.js
          test -s LigaZnaniyAndroid/app/src/main/assets/session-pdf.js
          grep -q 'decompositionCheck' LigaZnaniyAndroid/app/src/main/assets/topics/engine.js
          grep -q 'freeDecompStart' LigaZnaniyAndroid/app/src/main/assets/topics/app.js
          if grep -Ei 'csv' LigaZnaniyAndroid/app/src/main/assets/general/index.html LigaZnaniyAndroid/app/src/main/assets/topics/app.js; then
            echo "Unexpected CSV reference"; exit 1
          fi
      - name: Install platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: LigaZnaniyAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Collect APK
        run: |
          install -Dm644 LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk output/Liga_Znaniy_Ustny_Schet_5_5.apk
          unzip -l output/Liga_Znaniy_Ustny_Schet_5_5.apk | grep 'assets/topics/engine.js'
          unzip -l output/Liga_Znaniy_Ustny_Schet_5_5.apk | grep 'assets/session-pdf.js'
      - uses: actions/upload-artifact@v4
        with:
          name: Liga-Znaniy-Ustny-Schet-5-5-APK
          path: output/Liga_Znaniy_Ustny_Schet_5_5.apk
          if-no-files-found: error

  publish-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mental-math-v5-5-free-decomposition-20261031
      - name: Restore all approved training features for web
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > original.zip
          unzip -q -o original.zip
          base64 --decode apk-build/v54-source.b64 > v54.zip
          unzip -q -o v54.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/pdf-hotfix.b64 > pdf.zip
          unzip -q -o pdf.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/patch-v55.b64 > v55.zip
          unzip -q -o v55.zip -d LigaZnaniyAndroid
          test -s LigaZnaniyAndroid/app/src/main/assets/plan.html
          test -s LigaZnaniyAndroid/app/src/main/assets/mathjax-svg.js
          test -s LigaZnaniyAndroid/app/src/main/assets/topics/engine.js
      - name: Publish separate /ustny-schet/ directory to main for GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git worktree add --detach public-tree origin/main
          mkdir -p public-tree/ustny-schet
          rsync -a --delete LigaZnaniyAndroid/app/src/main/assets/ public-tree/ustny-schet/
          cd public-tree
          git add ustny-schet
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Ustny Schet 5.5: student-selected convenient decomposition'
            git push origin HEAD:main
          fi