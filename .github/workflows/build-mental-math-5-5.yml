name: Build Android mental math 5.5
on:
  push:
    branches: [android-mental-math-v5-5-free-split-20261031]
    paths:
      - 'apk-build/v55-updates.b64'
      - '.github/workflows/build-mental-math-5-5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apk-build/v55-updates.b64'
      - '.github/workflows/build-mental-math-5-5.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mental-math-v5-5-free-split-20261031
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore approved source and add independent-splitting level
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > base.zip
          unzip -q -o base.zip
          base64 --decode apk-build/v54-source.b64 > v54.zip
          unzip -q -o v54.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/pdf-hotfix.b64 > pdf.zip
          unzip -q -o pdf.zip -d LigaZnaniyAndroid
          base64 --decode apk-build/v55-updates.b64 > v55.zip
          unzip -q -o v55.zip -d LigaZnaniyAndroid
          grep -q 'function freeSplit' LigaZnaniyAndroid/app/src/main/assets/topics/engine.js
          grep -q 'id="splitAnswer"' LigaZnaniyAndroid/app/src/main/assets/topics/index.html
          test -s LigaZnaniyAndroid/app/src/main/assets/session-pdf.js
      - name: Install Android platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: |
          cd LigaZnaniyAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and collect
        run: |
          install -Dm644 LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk dist/Liga_Znaniy_Ustny_Schet_v5_5_Android.apk
          unzip -p dist/Liga_Znaniy_Ustny_Schet_v5_5_Android.apk assets/topics/engine.js | grep -q 'function freeSplit'
          unzip -l dist/Liga_Znaniy_Ustny_Schet_v5_5_Android.apk | grep -q 'assets/session-pdf.js'
      - uses: actions/upload-artifact@v4
        with:
          name: Liga-Znaniy-Ustny-Schet-5-5
          path: dist/Liga_Znaniy_Ustny_Schet_v5_5_Android.apk
          if-no-files-found: error
