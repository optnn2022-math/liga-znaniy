name: Сборка Android APK — Устный счёт 6.4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ustny-schet/**'
      - 'android-ustny-schet/**'
      - '.github/workflows/build-ustny-apk.yml'
  push:
    branches: [main, ustny-schet-v6.4-qa]
    paths:
      - 'android-ustny-schet/**'
      - 'ustny-schet/**'
      - '.github/workflows/build-ustny-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 35 and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Synchronize self-contained HTML for Android
        run: node ustny-schet/scripts/sync-offline-v64.cjs

      - name: Validate exercise selection
        run: |
          node --check ustny-schet/scripts/sync-offline-v64.cjs
          node --check ustny-schet/topics/adaptive.js
          node --check ustny-schet/topics/app.js
          node --check ustny-schet/plan.js
          node ustny-schet/tests/adaptive-v64.cjs

      - name: Bundle offline HTML and app icons
        run: |
          mkdir -p android-ustny-schet/app/src/main/assets/icons
          mkdir -p android-ustny-schet/app/src/main/res/drawable
          cp ustny-schet/v6-4.html android-ustny-schet/app/src/main/assets/index.html
          cp ustny-schet/manifest.webmanifest android-ustny-schet/app/src/main/assets/manifest.webmanifest
          cp ustny-schet/icons/icon-192.png android-ustny-schet/app/src/main/assets/icons/icon-192.png
          cp ustny-schet/icons/icon-512.png android-ustny-schet/app/src/main/assets/icons/icon-512.png
          cp ustny-schet/icons/icon-192.png android-ustny-schet/app/src/main/res/drawable/app_icon.png
          test -s android-ustny-schet/app/src/main/assets/index.html

      - name: Compile Android APK
        run: gradle -p android-ustny-schet :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for installation
        run: |
          mkdir -p release-apk
          cp android-ustny-schet/app/build/outputs/apk/debug/app-debug.apk release-apk/Liga_Znaniy_Ustny_Schet_v6.4.apk
          ls -lh release-apk/*.apk
          sha256sum release-apk/*.apk > release-apk/SHA256SUMS.txt

      - name: Attach APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: Liga_Znaniy_Ustny_Schet_v6.4
          path: release-apk/*
          retention-days: 90
          if-no-files-found: error

      - name: Attach synchronized HTML for QA
        uses: actions/upload-artifact@v4
        with:
          name: Liga_Znaniy_Ustny_Schet_v6.4_HTML
          path: ustny-schet/v6-4.html
          retention-days: 90

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ustny-schet-android-v6.4
          APK=release-apk/Liga_Znaniy_Ustny_Schet_v6.4.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release-apk/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" release-apk/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Лига знаний — Устный счёт 6.4 · Android" --notes "Установочный APK с автономной версией 6.4. Android 7+. Поддерживает PDF-отчёты, JSON резервные копии и обновление HTML через GitHub Pages. Сборка подписана тестовым ключом GitHub Actions, предназначена для установки напрямую, не для публикации в Google Play."
          fi
