name: Build mental math Android APK
on:
  push:
    branches: [android-mental-math-v5-2-build-20261031]
    paths:
      - 'apk-build/*.b64'
      - '.github/workflows/build-mental-math-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore complete Android source project
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > source.zip
          unzip -q -o source.zip
          test -f LigaZnaniyAndroid/app/src/main/assets/mathjax-svg.js
          test -f LigaZnaniyAndroid/app/src/main/assets/topics/engine.js
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: LigaZnaniyAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish installable APK to build branch
        run: |
          cp LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk
          git commit -m "Build installable Android mental math 5.2 APK"
          git push
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: liga-znaniy-ustny-schet-v5-2
          path: apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk
          if-no-files-found: error
