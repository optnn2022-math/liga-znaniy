name: Build mental math Android APK
on:
  push:
    branches: [android-mental-math-v5-2-build-20261031]
    paths:
      - 'apk-build/*.b64'
      - '.github/workflows/build-mental-math-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-mental-math-v5-2-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android source
        run: |
          cat apk-build/part*.b64 | tr -d '\r\n\t ' | base64 --decode > source.zip
          unzip -q -o source.zip
          test -f LigaZnaniyAndroid/app/src/main/assets/mathjax-svg.js
          test -f LigaZnaniyAndroid/app/src/main/assets/topics/engine.js
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        id: gradle_build
        run: |
          set -o pipefail
          (cd LigaZnaniyAndroid && gradle --no-daemon --stacktrace :app:assembleDebug) 2>&1 | tee apk-build/build-log.txt
      - name: Save build log and APK
        if: always()
        run: |
          echo "result=${{ steps.gradle_build.outcome }}" > apk-build/build-status.txt
          if [ -f LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp LigaZnaniyAndroid/app/build/outputs/apk/debug/app-debug.apk apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk-build/build-status.txt apk-build/build-log.txt apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record result of Android APK build'
            git push
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Znaniy-Ustny-Schet-v5-2
          path: apk-build/Liga_Znaniy_Ustny_Schet_5_2.apk
          if-no-files-found: error
