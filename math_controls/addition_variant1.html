<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лига знаний — Сложение натуральных чисел</title><style>body{font:17px system-ui;background:#eaf5ff;color:#17335b;margin:0}main{max-width:850px;margin:24px auto;padding:24px;background:white;border-radius:22px}h1{color:#1453a2}.q{padding:16px;border-bottom:1px solid #ddd}input,select,button{padding:10px;font:inherit;border-radius:10px}button{background:#1453a2;color:white;border:0;margin:20px 0}input{display:block;margin-top:9px;max-width:90%}</style><main><h1>⚽ Лига знаний · Контрольные работы</h1><p>Математика · 5 класс · Сложение натуральных чисел · Вариант 1</p><label>Уровень сложности <select id="level"><option value="A1">А1 — базовый</option><option value="B1">Б1 — повышенный</option><option value="C1">В1 — высокий</option></select></label><div id="tasks"></div><button id="check">Завершить и проверить</button><p id="score" role="status"></p><p>За каждый правильный ответ — 1 гол. Результат сохраняется в этом браузере.</p><p><a href="../index.html">← На главную</a></p></main><script>const sets={"A1":[["981453672 + 70142783",1051596455],["90546764 + 956324",91503088],["696 кг 790 г + 45 кг 48 г (в граммах)",741838],["(748 + 999) + 252",1999],["На сколько 7008 + 981 больше 2017?",5972]],"B1":[["808345892725 + 89204156379",897550049104],["7005443832 + 76237",7005520069],["34 т 3 кг + 8 ц 82 кг (в килограммах)",34885],["(33 + 286) + (204 + 367) + 314",1204],["Сумма трёх чисел: первое 632, каждое следующее на 33 больше",1995],["999 + 1000",1999]],"C1":[["456982456764 + 68560341783",525542798547],["199888787656 + 98666432605",298555220261],["21 км 356 м + 737 м 28 дм (в метрах)",22095.8],["(242 + 156) + (134 + 844) + 758",2134],["На 91 миллион больше суммы наибольшего семизначного и наименьшего трёхзначного",101000099],["20 + 40 + ... + 500",6500]]};const level=document.getElementById('level'),tasks=document.getElementById('tasks'),check=document.getElementById('check'),score=document.getElementById('score');function show(){tasks.replaceChildren();sets[level.value].forEach((x,i)=>{const d=document.createElement('div');d.className='q';const l=document.createElement('label');l.textContent=(i+1)+'. '+x[0];const f=document.createElement('input');f.id='q'+i;f.inputMode='decimal';l.appendChild(f);d.appendChild(l);tasks.appendChild(d)});score.textContent='';check.disabled=false}level.onchange=show;check.onclick=()=>{let n=0;sets[level.value].forEach((x,i)=>{const f=document.getElementById('q'+i);const v=f.value.replace(/\s/g,'').replace(',','.');const ok=v!==''&&Number(v)===x[1];f.style.borderColor=ok?'green':'red';if(ok)n++});score.textContent='Результат: '+n+' из '+sets[level.value].length+'. ⚽ Голов: '+n;localStorage.setItem('liga_math_control_'+level.value,JSON.stringify({correct:n,total:sets[level.value].length,date:new Date().toISOString()}));check.disabled=true};show();</script></html>
